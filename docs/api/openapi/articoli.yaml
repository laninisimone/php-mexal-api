openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Articoli
  version: "88201"
  description: |-
    Generato da `tools/api-docs/genera.php` a partire dall'help in linea (`GET /risorse/help?extended=true`)
    e da `?info=true` di un'installazione Mexal/Passcom 2.9.17 (versione gestionale 88201), integrato con il manuale WebAPI v3.1.
    Endpoint e campi dipendono da versione e moduli installati: la fonte di verità resta `?info=true`.

    **Convenzioni**

    - Autenticazione: `Authorization: Passepartout <base64(utente:password)>`; sul cloud si aggiunge ` Dominio=<DOMINIO>`.
    - Contesto aziendale: header `Coordinate-Gestionale: Azienda=XXX Anno=AAAA` (opzionali `SottoAzienda=`, `Magazzino=`).
    - Date `AAAAMMGG`, date-ora `AAAAMMGG HHMMSS`, decimali con il punto.
    - Gli array sono liste di coppie `[[indice, valore], ...]`, non liste semplici.
    - Chiavi composte unite da `+` nel path (es. `OC+1+15`). Codici con `/` o `\` vanno in esadecimale con `?encoding=hex`.
    - Paginazione: `max` limita i record, il token `next` della risposta va ripassato così com'è e subito.
    - Ricerca: `POST .../ricerca` con `filtri`; i filtri sono in AND, i valori di uno stesso filtro in OR.
    - Revisione (PUT): rimandare `data_ult_mod` letto dalla GET per il controllo di modifica concorrente.
    - Limiti: 5 richieste simultanee per utente WebAPI (oltre si riceve 503).
servers:
  - url: "https://{host}:{porta}/webapi/risorse"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi/risorse"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
tags:
  - name: articoli
    description: "Anagrafica articoli di magazzino: descrizioni, unità di misura, prezzi, costi, aliquota IVA, gruppo merceologico, dati di magazzino."
  - name: "articoli/{codice}/allegati"
    description: "Allegato binario di un articolo (immagine, icona, immagine-catalogo). Restituisce il file, non JSON. Campi non disponibili: interrogare ?info=true su un'installazione che abiliti la risorsa."
  - name: "articoli/{cod_articolo}/progressivi"
    description: "Progressivi di magazzino (giacenze, carichi, scarichi, ordinato, impegnato) di un singolo articolo. Campi ricavati dal manuale WebAPI v3.1: l'installazione interrogata non li espone con ?info=true."
  - name: "articoli/{codice_articolo}/abbinati"
    description: "Articoli abbinati a un articolo (gestione abbinamenti/colori): inserimento, lettura, modifica e cancellazione."
paths:
  "/articoli":
    get:
      tags:
        - articoli
      operationId: articoli_lista
      summary: Lista articoli
      description: |-
        Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento.

        Supporta paginazione e selezione campi

        Il campo data_ric_elab indica la data/ora di elaborazione della richiesta
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArticoliCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ArticoliLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
    post:
      tags:
        - articoli
      operationId: articoli_crea
      summary: Inserimento articolo
      description: "Risponde 201 senza body: il codice assegnato è nell'header `Location`."
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ArticoliInserimento"
      responses:
        "201":
          description: "Creato. Nessun body: il path della nuova risorsa è nell'header Location."
          headers:
            Location:
              description: "Path della risorsa creata (es. /webapi/risorse/articoli/...). Può contenere ?encoding=hex."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
  "/articoli/ricerca":
    post:
      tags:
        - articoli
      operationId: articoli_cerca
      summary: Ricerca articoli
      description: |-
        Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`.

        Più filtri sono combinati in AND
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArticoliCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ArticoliRicerca"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ArticoliLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
  "/articoli/{codice}":
    get:
      tags:
        - articoli
      operationId: articoli_leggi
      summary: Lettura articolo
      description: |-
        Supporta encoding base32/hex per codici con caratteri speciali (chiave encodable)

        La response contiene direttamente l’oggetto articolo (senza wrapper dati)
      parameters:
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArticoliCampo"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Articoli"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
    put:
      tags:
        - articoli
      operationId: articoli_modifica
      summary: Modifica articolo
      description: |-
        Inviare solo i campi da modificare, più `data_ult_mod` letto dalla GET se il controllo di modifica concorrente è attivo.

        Inviare solo i campi da aggiornare
      parameters:
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ArticoliModifica"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
    delete:
      tags:
        - articoli
      operationId: articoli_elimina
      summary: Cancellazione articolo
      description: Potrebbe fallire se l’articolo è referenziato in documenti esistenti
      parameters:
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
  "/articoli/{codice}/allegati/{tipo}":
    get:
      tags:
        - "articoli/{codice}/allegati"
      operationId: articoli_codice_allegati_leggi
      summary: Lettura allegato articolo
      description: |-
        Valori ammessi per tipo: immagine, icona, immagine-catalogo

        La response contiene il binario dell’immagine con Content-Type appropriato
      parameters:
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: tipo
          in: path
          required: true
          description: "Parte di chiave `tipo`."
          schema:
            type: string
            enum:
              - immagine
              - icona
              - immagine-catalogo
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "200":
          description: Contenuto binario dell'allegato
          content:
            "*/*":
              schema:
                type: string
                contentMediaType: application/octet-stream
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81600"
  "/articoli/{cod_articolo}/progressivi":
    get:
      tags:
        - "articoli/{cod_articolo}/progressivi"
      operationId: articoli_cod_articolo_progressivi_lista
      summary: Lista progressivi articolo
      description: Restituisce dati per tutti i magazzini dove l’articolo ha movimenti
      parameters:
        - name: cod_articolo
          in: path
          required: true
          description: "Parte di chiave `cod_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArticoliCodArticoloProgressiviCampo"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ArticoliCodArticoloProgressiviColonnare"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "82300"
  "/articoli/{codice_articolo}/abbinati/{codice}+{prog_abbinati}":
    get:
      tags:
        - "articoli/{codice_articolo}/abbinati"
      operationId: articoli_codice_articolo_abbinati_leggi
      summary: Lettura abbinato articolo
      parameters:
        - name: codice_articolo
          in: path
          required: true
          description: "Parte di chiave `codice_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: prog_abbinati
          in: path
          required: true
          description: "Parte di chiave `prog_abbinati`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ArticoliCodiceArticoloAbbinatiCampo"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ArticoliCodiceArticoloAbbinati"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "88000"
    put:
      tags:
        - "articoli/{codice_articolo}/abbinati"
      operationId: articoli_codice_articolo_abbinati_modifica
      summary: Modifica abbinato articolo
      description: "Inviare solo i campi da modificare, più `data_ult_mod` letto dalla GET se il controllo di modifica concorrente è attivo."
      parameters:
        - name: codice_articolo
          in: path
          required: true
          description: "Parte di chiave `codice_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: prog_abbinati
          in: path
          required: true
          description: "Parte di chiave `prog_abbinati`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ArticoliCodiceArticoloAbbinatiModifica"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "88000"
    delete:
      tags:
        - "articoli/{codice_articolo}/abbinati"
      operationId: articoli_codice_articolo_abbinati_elimina
      summary: Cancellazione abbinato articolo
      parameters:
        - name: codice_articolo
          in: path
          required: true
          description: "Parte di chiave `codice_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: prog_abbinati
          in: path
          required: true
          description: "Parte di chiave `prog_abbinati`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "88000"
  "/articoli/{codice_articolo}/abbinati":
    post:
      tags:
        - "articoli/{codice_articolo}/abbinati"
      operationId: articoli_codice_articolo_abbinati_crea
      summary: Inserimento abbinato
      description: "Risponde 201 senza body: il codice assegnato è nell'header `Location`."
      parameters:
        - name: codice_articolo
          in: path
          required: true
          description: "Parte di chiave `codice_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ArticoliCodiceArticoloAbbinatiInserimento"
      responses:
        "201":
          description: "Creato. Nessun body: il path della nuova risorsa è nell'header Location."
          headers:
            Location:
              description: "Path della risorsa creata (es. /webapi/risorse/articoli/{codice_articolo}/abbinati/...). Può contenere ?encoding=hex."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
components:
  securitySchemes:
    passepartout:
      type: apiKey
      in: header
      name: Authorization
      description: "Formato `Passepartout <base64(utente:password)>`. Sul cloud: `Passepartout <base64> Dominio=<DOMINIO>`. Con login di sistema operativo attivo (login=1) si aggiunge un secondo blocco `<base64(utente_so:password_so)>`."
  parameters:
    CoordinateGestionale:
      name: Coordinate-Gestionale
      in: header
      required: true
      description: Azienda e anno di lavoro, più sotto-azienda e magazzino di default facoltativi (magazzino 1 se omesso).
      schema:
        type: string
        pattern: "^Azienda=\\S+( SottoAzienda=\\S+)? Anno=\\d{4}( Magazzino=\\d+)?$"
        examples:
          - "Azienda=DEM Anno=2026 Magazzino=1"
    Max:
      name: max
      in: query
      description: Numero massimo di record per pagina. Il server può restituirne meno (limiti di 30 s e 50 MB).
      schema:
        type: integer
        minimum: 1
    Next:
      name: next
      in: query
      description: "Token di pagina restituito dalla risposta precedente: opaco, da usare subito e così com'è."
      schema:
        type: string
    Encoding:
      name: encoding
      in: query
      description: "Codifica delle parti di chiave nel path. Obbligatoria quando un codice contiene `/` o `\\`: il codice va inviato in esadecimale (es. `ARTI/S` -> `415254492f53`)."
      schema:
        type: string
        enum:
          - hex
          - base32
  responses:
    ErroreRichiesta:
      description: "Richiesta non valida: parametri o campi errati, errore gestionale (6001), coordinate mancanti."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonAutorizzato:
      description: "Credenziali assenti o errate. Attenzione: tentativi ripetuti bloccano l'utente WebAPI."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonTrovato:
      description: Risorsa inesistente o path non valido (nessun body).
    PoolEsaurito:
      description: "Pool di 5 servizi dell'utente WebAPI esaurito: riprovare più tardi, senza retry aggressivi."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    Articoli:
      type: object
      properties:
        codice:
          type: string
          description: Codice articolo. Campo chiave.
          x-mexal-tipo: Alfanumerico
        nr_record:
          type: integer
          description: "Num.rec.articolo. 0 Nuovo, <>0 Variaz. (sola lettura)."
          readOnly: true
          x-mexal-tipo: Numerico
        tipologia:
          type: string
          description: Tipo articolo.
          x-mexal-tipo: Alfanumerico
        tp_merce_rsm_fe:
          type: integer
          description: Tipo Merce RSM fatture emesse.
          x-mexal-tipo: Numerico
        tp_merce_rsm_fr:
          type: integer
          description: Tipo Merce RSM fatture ricevute.
          x-mexal-tipo: Numerico
        non_rimb_rsm:
          type: string
          description: Tipo Merce RSM non rimborsabile.
          x-mexal-tipo: Alfanumerico
        cod_struttura:
          type: integer
          description: Numero struttura. Valori da dati-generali/strutture-articoli.codice.
          x-mexal-tipo: Numerico
          x-mexal-riferimento:
            risorsa: dati-generali/strutture-articoli
            campo: codice
        descrizione:
          type: string
          description: Descrizione articolo.
          x-mexal-tipo: Alfanumerico
        descr_estesa:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 1
                maximum: 5
              - type: string
            minItems: 2
            maxItems: 2
          maxItems: 5
          description: "Descrizione estesa articolo. Array indicizzato [[indice, valore], ...] con indice da 1 a 5."
          x-mexal-tipo: Alfanumerico
        descrizione_agg:
