openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Anagrafica unica
  version: "88201"
  description: |-
    Generato da `tools/api-docs/genera.php` a partire dall'help in linea (`GET /risorse/help?extended=true`)
    e da `?info=true` di un'installazione Mexal/Passcom 2.9.17 (versione gestionale 88201), integrato con il manuale WebAPI v3.1.
    Endpoint e campi dipendono da versione e moduli installati: la fonte di verità resta `?info=true`.

    **Convenzioni**

    - Autenticazione: `Authorization: Passepartout <base64(utente:password)>`; sul cloud si aggiunge ` Dominio=<DOMINIO>`.
    - Contesto aziendale: header `Coordinate-Gestionale: Azienda=XXX Anno=AAAA` (opzionali `SottoAzienda=`, `Magazzino=`).
    - Date `AAAAMMGG`, date-ora `AAAAMMGG HHMMSS`, decimali con il punto.
    - Gli array sono liste di coppie `[[indice, valore], ...]`, non liste semplici.
    - Chiavi composte unite da `+` nel path (es. `OC+1+15`). Codici con `/` o `\` vanno in esadecimale con `?encoding=hex`.
    - Paginazione: `max` limita i record, il token `next` della risposta va ripassato così com'è e subito.
    - Ricerca: `POST .../ricerca` con `filtri`; i filtri sono in AND, i valori di uno stesso filtro in OR.
    - Revisione (PUT): rimandare `data_ult_mod` letto dalla GET per il controllo di modifica concorrente.
    - Limiti: 5 richieste simultanee per utente WebAPI (oltre si riceve 503).
servers:
  - url: "https://{host}:{porta}/webapi/risorse"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi/risorse"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
tags:
  - name: anagrafica-unica
    description: "Rubrica unica: anagrafiche condivise fra aziende, con storicizzazione delle variazioni. Non richiede l'header Coordinate-Gestionale."
  - name: anagrafica-unica/storico
    description: Versioni storicizzate delle anagrafiche della rubrica unica. Non richiede l'header Coordinate-Gestionale.
paths:
  "/anagrafica-unica":
    get:
      tags:
        - anagrafica-unica
      operationId: anagrafica_unica_lista
      summary: Lista anagrafiche uniche
      description: |-
        Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento.

        NON richiede Coordinate-Gestionale (archivio sovraziendale)

        Restituisce solo le anagrafiche con versione attiva (non scadute)

        Supporta paginazione tramite max e next
      parameters:
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AnagraficaUnicaCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AnagraficaUnicaLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "85000"
    post:
      tags:
        - anagrafica-unica
      operationId: anagrafica_unica_crea
      summary: Inserimento anagrafica unica
      description: |-
        Risponde 201 senza body: il codice assegnato è nell'header `Location`.

        NON richiede Coordinate-Gestionale (archivio sovraziendale)

        Il tag Location nella response restituisce l’id per referenziare la risorsa creata
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AnagraficaUnicaInserimento"
      responses:
        "201":
          description: "Creato. Nessun body: il path della nuova risorsa è nell'header Location."
          headers:
            Location:
              description: "Path della risorsa creata (es. /webapi/risorse/anagrafica-unica/...). Può contenere ?encoding=hex."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "85000"
  "/anagrafica-unica/ricerca":
    post:
      tags:
        - anagrafica-unica
      operationId: anagrafica_unica_cerca
      summary: Ricerca anagrafica unica
      description: |-
        Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`.

        Se data_fine_valid viene omessa nella chiave, viene utilizzata la data di apertura della sessione WebAPI (data odierna per l’anno corrente). In questo caso le Coordinate-Gestionale devono essere presenti nell’header per determinare l’anno

        Per leggere un dato storicizzato ad una certa data, passare la data effettiva di storicizzazione
      parameters:
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AnagraficaUnicaCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AnagraficaUnicaRicerca"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AnagraficaUnicaLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "85000"
  "/anagrafica-unica/{id_anagrafica}":
    get:
      tags:
        - anagrafica-unica
      operationId: anagrafica_unica_leggi
      summary: Lettura anagrafica unica
      parameters:
        - name: id_anagrafica
          in: path
          required: true
          description: "Parte di chiave `id_anagrafica`."
          schema:
            type: integer
            minimum: 0
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AnagraficaUnicaCampo"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AnagraficaUnica"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "85000"
    put:
      tags:
        - anagrafica-unica
      operationId: anagrafica_unica_modifica
      summary: Modifica anagrafica unica
      description: "Inviare solo i campi da modificare, più `data_ult_mod` letto dalla GET se il controllo di modifica concorrente è attivo."
      parameters:
        - name: id_anagrafica
          in: path
          required: true
          description: "Parte di chiave `id_anagrafica`."
          schema:
            type: integer
            minimum: 0
        - name: storicizza
          in: query
          description: Modalità storicizzazione (S o R)
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AnagraficaUnicaModifica"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "85000"
    delete:
      tags:
        - anagrafica-unica
      operationId: anagrafica_unica_elimina
      summary: Cancellazione anagrafica unica
      parameters:
        - name: id_anagrafica
          in: path
          required: true
          description: "Parte di chiave `id_anagrafica`."
          schema:
            type: integer
            minimum: 0
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "85000"
  "/anagrafica-unica/{id_anagrafica}+{data_fine_valid}":
    get:
      tags:
        - anagrafica-unica
      operationId: anagrafica_unica_leggi_2
      summary: Lettura anagrafica unica
      parameters:
        - name: id_anagrafica
          in: path
