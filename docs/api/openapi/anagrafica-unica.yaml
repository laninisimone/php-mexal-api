            minimum: 0
        - name: data_fine_valid
          in: path
          required: true
          description: "Parte di chiave `data_fine_valid`."
          schema:
            type: string
            pattern: "^[0-9]{8}$"
            description: Data AAAAMMGG
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AnagraficaUnicaCampo"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AnagraficaUnica"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "85000"
    put:
      tags:
        - anagrafica-unica
      operationId: anagrafica_unica_modifica_2
      summary: Modifica anagrafica unica
      description: "Inviare solo i campi da modificare, più `data_ult_mod` letto dalla GET se il controllo di modifica concorrente è attivo."
      parameters:
        - name: id_anagrafica
          in: path
          required: true
          description: "Parte di chiave `id_anagrafica`."
          schema:
            type: integer
            minimum: 0
        - name: data_fine_valid
          in: path
          required: true
          description: "Parte di chiave `data_fine_valid`."
          schema:
            type: string
            pattern: "^[0-9]{8}$"
            description: Data AAAAMMGG
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AnagraficaUnicaModifica"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "85000"
    delete:
      tags:
        - anagrafica-unica
      operationId: anagrafica_unica_elimina_2
      summary: Cancellazione anagrafica unica
      description: "La DELETE elimina un’intera storicizzazione alla data: se più blocchi di informazioni hanno la stessa data di storicizzazione verranno eliminati tutti"
      parameters:
        - name: id_anagrafica
          in: path
          required: true
          description: "Parte di chiave `id_anagrafica`."
          schema:
            type: integer
            minimum: 0
        - name: data_fine_valid
          in: path
          required: true
          description: "Parte di chiave `data_fine_valid`."
          schema:
            type: string
            pattern: "^[0-9]{8}$"
            description: Data AAAAMMGG
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "85000"
  "/anagrafica-unica/storico":
    get:
      tags:
        - anagrafica-unica/storico
      operationId: anagrafica_unica_storico_lista
      summary: Lista anagrafiche uniche
      description: |-
        Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento.

        Include anche le versioni con data_fine_valid nel passato

        Lo storico include campi aggiuntivi: data_iniz_valid, tp_dati, sottotp_dati, xxx_stor_iniz, xxx_stor_data
      parameters:
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AnagraficaUnicaStoricoCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AnagraficaUnicaStoricoLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "85100"
  "/anagrafica-unica/storico/ricerca":
    post:
      tags:
        - anagrafica-unica/storico
      operationId: anagrafica_unica_storico_cerca
      summary: Ricerca storico anagrafica unica
      description: |-
        Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`.

        Permette di cercare in tutte le versioni storiche dell’anagrafica
      parameters:
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AnagraficaUnicaStoricoCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
