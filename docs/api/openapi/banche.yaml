openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Banche
  version: "88201"
  description: |-
    Generato da `tools/api-docs/genera.php` a partire dall'help in linea (`GET /risorse/help?extended=true`)
    e da `?info=true` di un'installazione Mexal/Passcom 2.9.17 (versione gestionale 88201), integrato con il manuale WebAPI v3.1.
    Endpoint e campi dipendono da versione e moduli installati: la fonte di verità resta `?info=true`.

    **Convenzioni**

    - Autenticazione: `Authorization: Passepartout <base64(utente:password)>`; sul cloud si aggiunge ` Dominio=<DOMINIO>`.
    - Contesto aziendale: header `Coordinate-Gestionale: Azienda=XXX Anno=AAAA` (opzionali `SottoAzienda=`, `Magazzino=`).
    - Date `AAAAMMGG`, date-ora `AAAAMMGG HHMMSS`, decimali con il punto.
    - Gli array sono liste di coppie `[[indice, valore], ...]`, non liste semplici.
    - Chiavi composte unite da `+` nel path (es. `OC+1+15`). Codici con `/` o `\` vanno in esadecimale con `?encoding=hex`.
    - Paginazione: `max` limita i record, il token `next` della risposta va ripassato così com'è e subito.
    - Ricerca: `POST .../ricerca` con `filtri`; i filtri sono in AND, i valori di uno stesso filtro in OR.
    - Revisione (PUT): rimandare `data_ult_mod` letto dalla GET per il controllo di modifica concorrente.
    - Limiti: 5 richieste simultanee per utente WebAPI (oltre si riceve 503).
servers:
  - url: "https://{host}:{porta}/webapi/risorse"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi/risorse"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
tags:
  - name: banche
    description: Tabella delle banche (ABI, CAB, filiale).
paths:
  "/banche":
    get:
      tags:
        - banche
      operationId: banche_lista
      summary: Lista banche
      description: |-
        Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento.

        Supporta paginazione tramite parametri max e next (vedi Paginazione)

        Supporta selezione campi tramite parametro fields

        Non è disponibile la lettura di una singola banca per chiave
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BancheCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/BancheLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "84200"
  "/banche/ricerca":
    post:
      tags:
        - banche
      operationId: banche_cerca
      summary: Lista banche
      description: |-
        Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`.

        I filtri seguono il formato standard WebAPI (vedi Ricerca e Filtri)

        Condizioni supportate: =, <, <=, >, >=, <>, contiene, inizia_per

        I campi filtrabili corrispondono ai campi restituiti nella response
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BancheCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/BancheRicerca"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/BancheLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "84200"
components:
  securitySchemes:
    passepartout:
      type: apiKey
      in: header
      name: Authorization
      description: "Formato `Passepartout <base64(utente:password)>`. Sul cloud: `Passepartout <base64> Dominio=<DOMINIO>`. Con login di sistema operativo attivo (login=1) si aggiunge un secondo blocco `<base64(utente_so:password_so)>`."
  parameters:
    CoordinateGestionale:
      name: Coordinate-Gestionale
      in: header
      required: true
      description: Azienda e anno di lavoro, più sotto-azienda e magazzino di default facoltativi (magazzino 1 se omesso).
      schema:
        type: string
        pattern: "^Azienda=\\S+( SottoAzienda=\\S+)? Anno=\\d{4}( Magazzino=\\d+)?$"
        examples:
          - "Azienda=DEM Anno=2026 Magazzino=1"
    Max:
      name: max
      in: query
      description: Numero massimo di record per pagina. Il server può restituirne meno (limiti di 30 s e 50 MB).
      schema:
        type: integer
        minimum: 1
    Next:
      name: next
      in: query
      description: "Token di pagina restituito dalla risposta precedente: opaco, da usare subito e così com'è."
      schema:
        type: string
    Encoding:
      name: encoding
      in: query
      description: "Codifica delle parti di chiave nel path. Obbligatoria quando un codice contiene `/` o `\\`: il codice va inviato in esadecimale (es. `ARTI/S` -> `415254492f53`)."
      schema:
        type: string
        enum:
          - hex
          - base32
  responses:
    ErroreRichiesta:
      description: "Richiesta non valida: parametri o campi errati, errore gestionale (6001), coordinate mancanti."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonAutorizzato:
      description: "Credenziali assenti o errate. Attenzione: tentativi ripetuti bloccano l'utente WebAPI."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonTrovato:
      description: Risorsa inesistente o path non valido (nessun body).
    PoolEsaurito:
      description: "Pool di 5 servizi dell'utente WebAPI esaurito: riprovare più tardi, senza retry aggressivi."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    Banche:
      type: object
      properties:
        codice:
          type: integer
          description: Codice.
          x-mexal-tipo: Numerico
        banca:
          type: string
          description: Banca.
          x-mexal-tipo: Alfanumerico
        filiale:
          type: string
          description: Filiale.
          x-mexal-tipo: Alfanumerico
        abi:
          type: string
          description: Coordinate bancarie - ABI.
          x-mexal-tipo: Alfanumerico
        cab:
          type: string
          description: Coordinate bancarie - CAB.
          x-mexal-tipo: Alfanumerico
        bic:
          type: string
          description: Coordinate bancarie - BIC.
          x-mexal-tipo: Alfanumerico
        indirizzo:
          type: string
          description: Indirizzo.
          x-mexal-tipo: Alfanumerico
        cap:
          type: string
          description: CAP.
          x-mexal-tipo: Alfanumerico
        comune:
          type: string
          description: Comune.
          x-mexal-tipo: Alfanumerico
        provincia:
          type: string
          description: Provincia.
          x-mexal-tipo: Alfanumerico
        telefono:
          type: string
          description: Telefono.
          x-mexal-tipo: Alfanumerico
        fax:
          type: string
          description: Fax.
          x-mexal-tipo: Alfanumerico
        email:
          type: string
          description: Indirizzo e-mail.
          x-mexal-tipo: Alfanumerico
        url:
          type: string
          description: Indirizzo internet.
          x-mexal-tipo: Alfanumerico
        sigla_azienda:
          type: string
          description: Sigla azienda.
          x-mexal-tipo: Alfanumerico
        intendenza:
          type: string
          description: Intendenza di finanza che ha rilasciato l'autorizzazione all'applicazione bollo virtuale.
          x-mexal-tipo: Alfanumerico
        nr_autorizza:
          type: integer
          description: Numero autorizzazione dell'intendenza di finanza.
          x-mexal-tipo: Numerico
        data_autorizza:
          type: string
          description: Data autorizzazione dell'intendenza di finanza. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        tipo_invio_arch:
          type: string
          description: Tipo invio archivio.
          x-mexal-tipo: Alfanumerico
        gest_cr_lf:
          type: string
          description: Flag aggiungi CRLF.
          x-mexal-tipo: Alfanumerico
        cf_piva_cli_for:
          type: string
          description: Riporta codice fiscale o partita iva cliente/fornitore.
          x-mexal-tipo: Alfanumerico
        cf_piva_azienda:
          type: string
          description: Riporta codice fiscale o partita iva azienda.
          x-mexal-tipo: Alfanumerico
        gest_esito_pg:
          type: string
          description: Gestione esito pagamento.
          x-mexal-tipo: Alfanumerico
        gest_bonif_cbi:
          type: string
          description: Gestione bonifici CBI - Coordinate ordinante.
          x-mexal-tipo: Alfanumerico
        gest_mav_cbi:
          type: string
          description: Gestione MAV CBI - Coordinate ordinante.
          x-mexal-tipo: Alfanumerico
        gest_rid_cbi:
          type: string
          description: Gestione RID CBI - Coordinate ordinante.
          x-mexal-tipo: Alfanumerico
        tipo_codice_rid:
          type: string
          description: RID Coordinate azienda creditrice - Tipo codice.
          x-mexal-tipo: Alfanumerico
        tipo_inc_rid:
          type: string
          description: RID - Tipo incasso.
          x-mexal-tipo: Alfanumerico
      x-mexal-origine-campi: info
    BancheCampo:
      type: string
      enum:
        - codice
        - banca
        - filiale
        - abi
        - cab
        - bic
        - indirizzo
        - cap
        - comune
        - provincia
        - telefono
        - fax
        - email
        - url
        - sigla_azienda
        - intendenza
        - nr_autorizza
        - data_autorizza
        - tipo_invio_arch
        - gest_cr_lf
        - cf_piva_cli_for
        - cf_piva_azienda
        - gest_esito_pg
        - gest_bonif_cbi
        - gest_mav_cbi
        - gest_rid_cbi
        - tipo_codice_rid
        - tipo_inc_rid
      description: Campi di banche.
    BancheLista:
      type: object
      required:
        - dati
      properties:
        dati:
          type: array
          items:
            $ref: "#/components/schemas/Banche"
        data_ric_elab:
          type: string
          description: Timestamp di elaborazione, AAAAMMGG HHMMSS.
        next:
          type: string
          description: "Presente solo se ci sono altre pagine: da passare così com'è nel parametro next."
    BancheRicerca:
      type: object
      required:
        - filtri
      properties:
        filtri:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/Filtro"
              - properties:
                  campo:
                    $ref: "#/components/schemas/BancheCampo"
    Filtro:
      type: object
      required:
        - campo
        - condizione
        - valore
      properties:
        campo:
          type: string
          description: Nome del campo su cui filtrare.
        indice1:
          type: integer
          minimum: 1
          description: Indice del primo livello, per i campi array.
        indice2:
          type: integer
          minimum: 1
          description: Indice del secondo livello, per gli array a due livelli.
        condizione:
          type: string
          enum:
            - "="
            - "<>"
            - ">"
            - "<"
            - ">="
            - "<="
            - contiene
            - inizia_per
        case_insensitive:
          type: boolean
          default: false
          description: Solo per i confronti fra stringhe.
        valore:
          description: "Valore da confrontare; un array mette i valori in OR. Date come AAAAMMGG."
          anyOf:
            - type: string
            - type: number
            - type: array
              minItems: 1
              items:
                type:
                  - string
                  - number
    Errore:
      type: object
      properties:
        error:
          type: object
          properties:
            response-code:
              type: integer
            response-detail:
              type: string
              description: "Codice numerico + messaggio: \"<codice> - <messaggio> [<dettaglio>]\". 6001 = errore gestionale."
            response-message:
              type: string
            request-uri:
              type: string
            request-method:
              type: string
            request-id:
              type: string
              description: UUID da citare al supporto.
            warsion:
              type: string
            remote:
              type: string
            timestamp:
              type: string
