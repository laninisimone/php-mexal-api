openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Alias articoli
  version: "88201"
  description: |-
    Generato da `tools/api-docs/genera.php` a partire dall'help in linea (`GET /risorse/help?extended=true`)
    e da `?info=true` di un'installazione Mexal/Passcom 2.9.17 (versione gestionale 88201), integrato con il manuale WebAPI v3.1.
    Endpoint e campi dipendono da versione e moduli installati: la fonte di verità resta `?info=true`.

    **Convenzioni**

    - Autenticazione: `Authorization: Passepartout <base64(utente:password)>`; sul cloud si aggiunge ` Dominio=<DOMINIO>`.
    - Contesto aziendale: header `Coordinate-Gestionale: Azienda=XXX Anno=AAAA` (opzionali `SottoAzienda=`, `Magazzino=`).
    - Date `AAAAMMGG`, date-ora `AAAAMMGG HHMMSS`, decimali con il punto.
    - Gli array sono liste di coppie `[[indice, valore], ...]`, non liste semplici.
    - Chiavi composte unite da `+` nel path (es. `OC+1+15`). Codici con `/` o `\` vanno in esadecimale con `?encoding=hex`.
    - Paginazione: `max` limita i record, il token `next` della risposta va ripassato così com'è e subito.
    - Ricerca: `POST .../ricerca` con `filtri`; i filtri sono in AND, i valori di uno stesso filtro in OR.
    - Revisione (PUT): rimandare `data_ult_mod` letto dalla GET per il controllo di modifica concorrente.
    - Limiti: 5 richieste simultanee per utente WebAPI (oltre si riceve 503).
servers:
  - url: "https://{host}:{porta}/webapi/risorse"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi/risorse"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
tags:
  - name: alias-articoli
    description: "Codici alternativi (alias) degli articoli: codici cliente, fornitore o personalizzati."
paths:
  "/alias-articoli":
    get:
      tags:
        - alias-articoli
      operationId: alias_articoli_lista
      summary: Lista alias articoli
      description: |-
        Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento.

        Supporta paginazione tramite parametri max e next

        Supporta selezione campi tramite parametro fields
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AliasArticoliCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AliasArticoliLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "82400"
    post:
      tags:
        - alias-articoli
      operationId: alias_articoli_crea
      summary: Inserimento alias articolo
      description: |-
        Risponde 201 senza body: il codice assegnato è nell'header `Location`.

        La response restituisce l’header Location con l’URL della risorsa creata
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AliasArticoliInserimento"
      responses:
        "201":
          description: "Creato. Nessun body: il path della nuova risorsa è nell'header Location."
          headers:
            Location:
              description: "Path della risorsa creata (es. /webapi/risorse/alias-articoli/...). Può contenere ?encoding=hex."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "83000"
  "/alias-articoli/ricerca":
    post:
      tags:
        - alias-articoli
      operationId: alias_articoli_cerca
      summary: Ricerca alias articoli
      description: |-
        Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`.

        I filtri nel body seguono il formato standard: campo, condizione, valore

        Condizioni supportate: =, <, <=, >, >=, <>, contiene, inizia_per
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AliasArticoliCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AliasArticoliRicerca"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AliasArticoliLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "82400"
  "/alias-articoli/{cod_alias}+{prog_alias}+{cod_articolo}":
    get:
      tags:
        - alias-articoli
      operationId: alias_articoli_leggi
      summary: Lettura alias articolo
      description: |-
        La chiave è composta da tre segmenti separati da +

        I campi stringa con caratteri speciali (es. /, \) possono richiedere encoding base32 o hex
      parameters:
        - name: cod_alias
          in: path
          required: true
          description: "Parte di chiave `cod_alias`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: prog_alias
          in: path
          required: true
          description: "Parte di chiave `prog_alias`."
          schema:
            type: integer
            minimum: 0
        - name: cod_articolo
          in: path
          required: true
          description: "Parte di chiave `cod_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AliasArticoliCampo"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AliasArticoli"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "82400"
    put:
      tags:
        - alias-articoli
      operationId: alias_articoli_modifica
      summary: Modifica alias articolo
      description: |-
        Inviare solo i campi da modificare, più `data_ult_mod` letto dalla GET se il controllo di modifica concorrente è attivo.

        Inviare nel body solo i campi da modificare

        I campi chiave non sono modificabili
      parameters:
        - name: cod_alias
          in: path
          required: true
          description: "Parte di chiave `cod_alias`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: prog_alias
          in: path
          required: true
          description: "Parte di chiave `prog_alias`."
          schema:
            type: integer
            minimum: 0
        - name: cod_articolo
          in: path
          required: true
          description: "Parte di chiave `cod_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AliasArticoliModifica"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "83000"
    delete:
      tags:
        - alias-articoli
      operationId: alias_articoli_elimina
      summary: Cancellazione alias articolo
      description: L’operazione è irreversibile
      parameters:
        - name: cod_alias
          in: path
          required: true
          description: "Parte di chiave `cod_alias`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: prog_alias
          in: path
          required: true
          description: "Parte di chiave `prog_alias`."
          schema:
            type: integer
            minimum: 0
        - name: cod_articolo
          in: path
          required: true
          description: "Parte di chiave `cod_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "83000"
components:
  securitySchemes:
    passepartout:
      type: apiKey
      in: header
      name: Authorization
      description: "Formato `Passepartout <base64(utente:password)>`. Sul cloud: `Passepartout <base64> Dominio=<DOMINIO>`. Con login di sistema operativo attivo (login=1) si aggiunge un secondo blocco `<base64(utente_so:password_so)>`."
  parameters:
    CoordinateGestionale:
      name: Coordinate-Gestionale
      in: header
      required: true
      description: Azienda e anno di lavoro, più sotto-azienda e magazzino di default facoltativi (magazzino 1 se omesso).
      schema:
        type: string
        pattern: "^Azienda=\\S+( SottoAzienda=\\S+)? Anno=\\d{4}( Magazzino=\\d+)?$"
        examples:
          - "Azienda=DEM Anno=2026 Magazzino=1"
    Max:
      name: max
      in: query
      description: Numero massimo di record per pagina. Il server può restituirne meno (limiti di 30 s e 50 MB).
      schema:
        type: integer
        minimum: 1
    Next:
      name: next
      in: query
      description: "Token di pagina restituito dalla risposta precedente: opaco, da usare subito e così com'è."
      schema:
        type: string
    Encoding:
      name: encoding
      in: query
      description: "Codifica delle parti di chiave nel path. Obbligatoria quando un codice contiene `/` o `\\`: il codice va inviato in esadecimale (es. `ARTI/S` -> `415254492f53`)."
      schema:
        type: string
        enum:
          - hex
          - base32
  responses:
    ErroreRichiesta:
      description: "Richiesta non valida: parametri o campi errati, errore gestionale (6001), coordinate mancanti."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonAutorizzato:
      description: "Credenziali assenti o errate. Attenzione: tentativi ripetuti bloccano l'utente WebAPI."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonTrovato:
      description: Risorsa inesistente o path non valido (nessun body).
    PoolEsaurito:
      description: "Pool di 5 servizi dell'utente WebAPI esaurito: riprovare più tardi, senza retry aggressivi."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    AliasArticoli:
      type: object
      properties:
        id:
          type: integer
          description: Identificatore alias.
          x-mexal-tipo: Numerico
        prog_alias:
          type: integer
          description: Progressivo alias (uguali). Campo chiave.
          x-mexal-tipo: Numerico
        cod_alias:
          type: string
          description: Codice alias da assegnare. Campo chiave.
          x-mexal-tipo: Alfanumerico
        cod_articolo:
          type: string
          description: Codice articolo associato. Valori da articoli.codice. Campo chiave.
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa: articoli
            campo: codice
        descrizione:
          type: string
          description: Descrizione dell’alias.
          x-mexal-tipo: Alfanumerico
        nota1:
          type: string
          description: Nota 1.
          x-mexal-tipo: Alfanumerico
        nota2:
          type: string
          description: Nota 2.
          x-mexal-tipo: Alfanumerico
        nr_colli:
          type: integer
          description: Numero colli.
          x-mexal-tipo: Numerico
        quantita:
          type: number
          description: "Quantita' — Quantità."
          x-mexal-tipo: Numerico con virgola
        um:
          type: string
          description: "Tipo unita' di muìisura — Unità di misura."
          x-mexal-tipo: Alfanumerico
        data_crea:
          type: string
          description: Data ora creazione (sola lettura). Data in formato AAAAMMGG.
          readOnly: true
          x-mexal-tipo: Alfanumerico
        data_ult_mod:
          type: string
          description: Data ora ultima modifica (sola lettura). Data in formato AAAAMMGG.
          readOnly: true
          x-mexal-tipo: Alfanumerico
      x-mexal-origine-campi: info
    AliasArticoliCampo:
      type: string
      enum:
        - id
        - prog_alias
        - cod_alias
        - cod_articolo
        - descrizione
        - nota1
        - nota2
        - nr_colli
        - quantita
        - um
        - data_crea
        - data_ult_mod
      description: Campi di alias-articoli.
    AliasArticoliLista:
      type: object
      required:
        - dati
      properties:
        dati:
          type: array
          items:
            $ref: "#/components/schemas/AliasArticoli"
        data_ric_elab:
          type: string
          description: Timestamp di elaborazione, AAAAMMGG HHMMSS.
        next:
          type: string
          description: "Presente solo se ci sono altre pagine: da passare così com'è nel parametro next."
    AliasArticoliRicerca:
      type: object
      required:
        - filtri
      properties:
        filtri:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/Filtro"
              - properties:
                  campo:
                    $ref: "#/components/schemas/AliasArticoliCampo"
    AliasArticoliInserimento:
      allOf:
        - $ref: "#/components/schemas/AliasArticoli"
      required:
        - cod_alias
        - prog_alias
        - cod_articolo
      description: "Body di inserimento. Obbligatori secondo il manuale: cod_alias, prog_alias, cod_articolo."
    AliasArticoliModifica:
      allOf:
        - $ref: "#/components/schemas/AliasArticoli"
      description: "Body di revisione: solo i campi da modificare. Campi da indicare sempre secondo ?info=true: prog_alias, cod_alias, cod_articolo."
      x-mexal-obbligatori-put:
        - prog_alias
        - cod_alias
        - cod_articolo
    Filtro:
      type: object
      required:
        - campo
        - condizione
        - valore
      properties:
        campo:
          type: string
          description: Nome del campo su cui filtrare.
        indice1:
          type: integer
          minimum: 1
          description: Indice del primo livello, per i campi array.
        indice2:
          type: integer
          minimum: 1
          description: Indice del secondo livello, per gli array a due livelli.
        condizione:
          type: string
          enum:
            - "="
            - "<>"
            - ">"
            - "<"
            - ">="
            - "<="
            - contiene
            - inizia_per
        case_insensitive:
          type: boolean
          default: false
          description: Solo per i confronti fra stringhe.
        valore:
          description: "Valore da confrontare; un array mette i valori in OR. Date come AAAAMMGG."
          anyOf:
            - type: string
            - type: number
            - type: array
              minItems: 1
              items:
                type:
                  - string
                  - number
    Errore:
      type: object
      properties:
        error:
          type: object
          properties:
            response-code:
              type: integer
            response-detail:
              type: string
              description: "Codice numerico + messaggio: \"<codice> - <messaggio> [<dettaglio>]\". 6001 = errore gestionale."
            response-message:
              type: string
            request-uri:
              type: string
            request-method:
              type: string
            request-id:
              type: string
              description: UUID da citare al supporto.
            warsion:
              type: string
            remote:
              type: string
            timestamp:
              type: string
