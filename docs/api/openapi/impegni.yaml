openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Impegni
  version: "88201"
  description: |-
    Generato da `tools/api-docs/genera.php` a partire dall'help in linea (`GET /risorse/help?extended=true`)
    e da `?info=true` di un'installazione Mexal/Passcom 2.9.17 (versione gestionale 88201), integrato con il manuale WebAPI v3.1.
    Endpoint e campi dipendono da versione e moduli installati: la fonte di verità resta `?info=true`.

    **Convenzioni**

    - Autenticazione: `Authorization: Passepartout <base64(utente:password)>`; sul cloud si aggiunge ` Dominio=<DOMINIO>`.
    - Contesto aziendale: header `Coordinate-Gestionale: Azienda=XXX Anno=AAAA` (opzionali `SottoAzienda=`, `Magazzino=`).
    - Date `AAAAMMGG`, date-ora `AAAAMMGG HHMMSS`, decimali con il punto.
    - Gli array sono liste di coppie `[[indice, valore], ...]`, non liste semplici.
    - Chiavi composte unite da `+` nel path (es. `OC+1+15`). Codici con `/` o `\` vanno in esadecimale con `?encoding=hex`.
    - Paginazione: `max` limita i record, il token `next` della risposta va ripassato così com'è e subito.
    - Ricerca: `POST .../ricerca` con `filtri`; i filtri sono in AND, i valori di uno stesso filtro in OR.
    - Revisione (PUT): rimandare `data_ult_mod` letto dalla GET per il controllo di modifica concorrente.
    - Limiti: 5 richieste simultanee per utente WebAPI (oltre si riceve 503).
servers:
  - url: "https://{host}:{porta}/webapi/risorse"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi/risorse"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
tags:
  - name: impegni
    description: "Endpoint legacy degli impegni delle bolle di lavorazione: deprecato, usare documenti/lavorazione/impegni. Campi ricavati dal manuale WebAPI v3.1: l'installazione interrogata non li espone con ?info=true (6001 - errore gestionale [cmd lista_impegni disponibile solo per aziende di livello produzione o superiore])."
paths:
  "/impegni":
    get:
      tags:
        - impegni
      operationId: impegni_lista
      summary: Lista impegni bolle di lavorazione
      description: "Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento."
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ImpegniCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ImpegniLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81800"
    post:
      tags:
        - impegni
      operationId: impegni_crea
      summary: Inserimento impegno bolla di lavorazione
      description: "Risponde 201 senza body: il codice assegnato è nell'header `Location`."
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ImpegniInserimento"
      responses:
        "201":
          description: "Creato. Nessun body: il path della nuova risorsa è nell'header Location."
          headers:
            Location:
              description: "Path della risorsa creata (es. /webapi/risorse/impegni/...). Può contenere ?encoding=hex."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81800"
  "/impegni/ricerca":
    post:
      tags:
        - impegni
      operationId: impegni_cerca
      summary: Ricerca impegni bolle di lavorazione
      description: "Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`."
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ImpegniCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ImpegniRicerca"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ImpegniLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81800"
  "/impegni/{codice}+{cod_sottobolla}+{nr_rif_pf}+{nr_fase}+{cod_magazzino}+{cod_articolo}+{id_ubicazione}":
    get:
      tags:
        - impegni
      operationId: impegni_leggi
      summary: Lettura impegno bolla di lavorazione
      parameters:
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`."
          schema:
            type: integer
            minimum: 0
        - name: cod_sottobolla
          in: path
          required: true
          description: "Parte di chiave `cod_sottobolla`."
          schema:
            type: integer
            minimum: 0
        - name: nr_rif_pf
          in: path
          required: true
          description: "Parte di chiave `nr_rif_pf`."
          schema:
            type: integer
            minimum: 0
        - name: nr_fase
          in: path
          required: true
          description: "Parte di chiave `nr_fase`."
          schema:
            type: integer
            minimum: 0
        - name: cod_magazzino
          in: path
          required: true
          description: "Parte di chiave `cod_magazzino`."
          schema:
            type: integer
            minimum: 0
        - name: cod_articolo
          in: path
          required: true
          description: "Parte di chiave `cod_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: id_ubicazione
          in: path
          required: true
          description: "Parte di chiave `id_ubicazione`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ImpegniCampo"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Impegni"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81800"
    put:
      tags:
        - impegni
      operationId: impegni_modifica
      summary: Modifica impegno bolla di lavorazione
      description: "Inviare solo i campi da modificare, più `data_ult_mod` letto dalla GET se il controllo di modifica concorrente è attivo."
      parameters:
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`."
          schema:
            type: integer
            minimum: 0
        - name: cod_sottobolla
          in: path
          required: true
          description: "Parte di chiave `cod_sottobolla`."
          schema:
            type: integer
            minimum: 0
        - name: nr_rif_pf
          in: path
          required: true
          description: "Parte di chiave `nr_rif_pf`."
          schema:
            type: integer
            minimum: 0
        - name: nr_fase
          in: path
          required: true
          description: "Parte di chiave `nr_fase`."
          schema:
            type: integer
            minimum: 0
        - name: cod_magazzino
          in: path
          required: true
          description: "Parte di chiave `cod_magazzino`."
          schema:
            type: integer
            minimum: 0
        - name: cod_articolo
          in: path
          required: true
          description: "Parte di chiave `cod_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: id_ubicazione
          in: path
          required: true
          description: "Parte di chiave `id_ubicazione`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ImpegniModifica"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81800"
    delete:
      tags:
        - impegni
      operationId: impegni_elimina
      summary: Cancellazione impegno bolla di lavorazione
      parameters:
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`."
          schema:
            type: integer
            minimum: 0
        - name: cod_sottobolla
          in: path
          required: true
          description: "Parte di chiave `cod_sottobolla`."
          schema:
            type: integer
            minimum: 0
        - name: nr_rif_pf
          in: path
          required: true
          description: "Parte di chiave `nr_rif_pf`."
          schema:
            type: integer
            minimum: 0
        - name: nr_fase
          in: path
          required: true
          description: "Parte di chiave `nr_fase`."
          schema:
            type: integer
            minimum: 0
        - name: cod_magazzino
          in: path
          required: true
          description: "Parte di chiave `cod_magazzino`."
          schema:
            type: integer
            minimum: 0
        - name: cod_articolo
          in: path
          required: true
          description: "Parte di chiave `cod_articolo`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - name: id_ubicazione
          in: path
          required: true
          description: "Parte di chiave `id_ubicazione`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81800"
components:
  securitySchemes:
    passepartout:
      type: apiKey
      in: header
      name: Authorization
      description: "Formato `Passepartout <base64(utente:password)>`. Sul cloud: `Passepartout <base64> Dominio=<DOMINIO>`. Con login di sistema operativo attivo (login=1) si aggiunge un secondo blocco `<base64(utente_so:password_so)>`."
  parameters:
    CoordinateGestionale:
      name: Coordinate-Gestionale
      in: header
      required: true
      description: Azienda e anno di lavoro, più sotto-azienda e magazzino di default facoltativi (magazzino 1 se omesso).
      schema:
        type: string
        pattern: "^Azienda=\\S+( SottoAzienda=\\S+)? Anno=\\d{4}( Magazzino=\\d+)?$"
        examples:
          - "Azienda=DEM Anno=2026 Magazzino=1"
    Max:
      name: max
      in: query
      description: Numero massimo di record per pagina. Il server può restituirne meno (limiti di 30 s e 50 MB).
      schema:
        type: integer
        minimum: 1
    Next:
      name: next
      in: query
      description: "Token di pagina restituito dalla risposta precedente: opaco, da usare subito e così com'è."
      schema:
        type: string
    Encoding:
      name: encoding
      in: query
      description: "Codifica delle parti di chiave nel path. Obbligatoria quando un codice contiene `/` o `\\`: il codice va inviato in esadecimale (es. `ARTI/S` -> `415254492f53`)."
      schema:
        type: string
        enum:
          - hex
          - base32
  responses:
    ErroreRichiesta:
      description: "Richiesta non valida: parametri o campi errati, errore gestionale (6001), coordinate mancanti."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonAutorizzato:
      description: "Credenziali assenti o errate. Attenzione: tentativi ripetuti bloccano l'utente WebAPI."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonTrovato:
      description: Risorsa inesistente o path non valido (nessun body).
    PoolEsaurito:
      description: "Pool di 5 servizi dell'utente WebAPI esaurito: riprovare più tardi, senza retry aggressivi."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    Impegni:
      type: object
      properties:
        codice:
          type: integer
          description: Numero documento (bolla di lavorazione). Campo chiave.
          x-mexal-tipo: Numerico
        cod_sottobolla:
          type: integer
          description: Numero sottodocumento. Campo chiave.
          x-mexal-tipo: Numerico
        nr_rif_pf:
          type: integer
          description: "Numero riferimento prodotto finito: >0 = numero, - 1 = residui per depositi, -2 = residui per scarichi. Campo chiave."
          x-mexal-tipo: Numerico
        nr_fase:
          type: integer
          description: Numero fase prodotto finito. Campo chiave.
          x-mexal-tipo: Numerico
        cod_magazzino:
          type: integer
          description: Magazzino materie prime. Valori da dati-generali/magazzini.id. Numero magazzino. Campo chiave.
          x-mexal-tipo: Numerico
          x-mexal-riferimento:
            risorsa: dati-generali/magazzini
            campo: id
            nota: Numero magazzino
        cod_articolo:
          type: string
          description: Codice articolo materia prima. Valori da articoli.codice. Campo chiave.
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa: articoli
            campo: codice
        id_ubicazione:
          type: integer
          description: "Ubicazione. Valori da ubicazioni.id. 0 = nessuna ubicazione. Campo chiave."
          x-mexal-tipo: Numerico
          x-mexal-riferimento:
            risorsa: ubicazioni
            campo: id
            nota: "0 = nessuna ubicazione"
        progressivo:
          type: integer
          description: Progressivo inserimento. Campo chiave.
          x-mexal-tipo: Numerico
        dt_sca_riga_bl:
          type: string
          description: Data scadenza riga bolla. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        tab_taglie:
          type: integer
          description: "Misura: 1-99 taglie; 101 tipo articolo unità misura (um1); 102 tipo articolo unità misura (um2)."
          x-mexal-tipo: Numerico
        nr_colli:
          type: integer
          description: Numero colli o quantità variabile.
          x-mexal-tipo: Numerico
        quantita:
          type: number
          description: No Quantità o quantità fissa.
          x-mexal-tipo: Numerico con virgola
        quantita_taglia:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 1
                maximum: 32
              - type: string
            minItems: 2
            maxItems: 2
          maxItems: 32
          description: "numerico No Quantità per taglia (32 posizioni). Array indicizzato [[indice, valore], ...] con indice da 1 a 32."
          x-mexal-tipo: Alfanumerico
        prezzo:
          type: number
          description: No Prezzo.
          x-mexal-tipo: Numerico con virgola
        tp_evidenza:
          type: string
          description: "Evidenza: ' ', 'E', 'L', 'T'."
          x-mexal-tipo: Alfanumerico
        indice:
          type: string
          description: Indice.
          x-mexal-tipo: Alfanumerico
        gest_depositato:
          type: string
          description: Depositato (S/N).
          x-mexal-tipo: Alfanumerico
        gest_escludi_dl:
          type: string
          description: Escludi dai depositi (S/N).
          x-mexal-tipo: Alfanumerico
        gest_escludi_sl:
          type: string
          description: Escludi dagli scarichi (S/N).
          x-mexal-tipo: Alfanumerico
        gest_costo_dbp:
          type: string
          description: Gestione costo DBP (S/N).
          x-mexal-tipo: Alfanumerico
        gest_prz_bloc:
          type: string
          description: Gestione prezzo bloccato (S/N).
          x-mexal-tipo: Alfanumerico
        tp_articolo:
          type: string
          description: Tipologia articolo.
          x-mexal-tipo: Alfanumerico
        cod_ciclo_fase:
          type: integer
          description: Codice ciclo fase.
          x-mexal-tipo: Numerico
        gest_ril_lavora:
          type: string
          description: Lavorazione da rilevare (S/N).
          x-mexal-tipo: Alfanumerico
        gest_lav_rileva:
          type: string
          description: Lavorazione rilevata (S/N).
          x-mexal-tipo: Alfanumerico
        pos_in_dbp:
          type: integer
          description: Posizione in distinta base di produzione.
          x-mexal-tipo: Numerico
        utente_ult_mod:
          type: string
          description: Utente ultima modifica.
          x-mexal-tipo: Alfanumerico
        data_ult_mod:
          type: string
          pattern: "^(\\d{8} \\d{6})?$"
          description: Data ora ultima modifica (formato AAAAMMGG HHMMSS).
          x-mexal-tipo: Data e ora
        pos_righe_lotto:
          type: integer
          description: Posizione righe lotto.
          x-mexal-tipo: Numerico
        nr_righe_lotto:
          type: integer
          description: Numero righe lotto.
          x-mexal-tipo: Numerico
        id_lotto:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 1
              - type: number
            minItems: 2
            maxItems: 2
          description: "ID lotti associati. Array indicizzato [[indice, valore], ...]. Valori da lotti.id."
          x-mexal-tipo: Numerico con virgola
          x-mexal-riferimento:
            risorsa: lotti
            campo: id
        nr_decimali_qta:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 1
              - type: number
            minItems: 2
            maxItems: 2
          description: "Numero decimali quantità per lotto. Array indicizzato [[indice, valore], ...]."
          x-mexal-tipo: Numerico con virgola
        qta_lotto:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 1
              - type: number
            minItems: 2
            maxItems: 2
          description: "Quantità per lotto. Array indicizzato [[indice, valore], ...]."
          x-mexal-tipo: Numerico con virgola
        nr_colli_lotto:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 1
              - type: number
            minItems: 2
            maxItems: 2
          description: "Numero colli per lotto. Array indicizzato [[indice, valore], ...]."
          x-mexal-tipo: Numerico con virgola
        qta_tg_lotto:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 1
              - type: number
            minItems: 2
            maxItems: 2
          description: "Quantità taglie per lotto. Array indicizzato [[indice, valore], ...]."
          x-mexal-tipo: Numerico con virgola
      x-mexal-origine-campi: manuale
    ImpegniCampo:
      type: string
      enum:
        - codice
        - cod_sottobolla
        - nr_rif_pf
        - nr_fase
        - cod_magazzino
        - cod_articolo
        - id_ubicazione
        - progressivo
        - dt_sca_riga_bl
        - tab_taglie
        - nr_colli
        - quantita
        - quantita_taglia
        - prezzo
        - tp_evidenza
        - indice
        - gest_depositato
        - gest_escludi_dl
        - gest_escludi_sl
        - gest_costo_dbp
        - gest_prz_bloc
        - tp_articolo
        - cod_ciclo_fase
        - gest_ril_lavora
        - gest_lav_rileva
        - pos_in_dbp
        - utente_ult_mod
        - data_ult_mod
        - pos_righe_lotto
        - nr_righe_lotto
        - id_lotto
        - nr_decimali_qta
        - qta_lotto
        - nr_colli_lotto
        - qta_tg_lotto
      description: Campi di impegni.
    ImpegniLista:
      type: object
      required:
        - dati
      properties:
        dati:
          type: array
          items:
            $ref: "#/components/schemas/Impegni"
        data_ric_elab:
          type: string
          description: Timestamp di elaborazione, AAAAMMGG HHMMSS.
        next:
          type: string
          description: "Presente solo se ci sono altre pagine: da passare così com'è nel parametro next."
    ImpegniRicerca:
      type: object
      required:
        - filtri
      properties:
        filtri:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/Filtro"
              - properties:
                  campo:
                    $ref: "#/components/schemas/ImpegniCampo"
    ImpegniInserimento:
      allOf:
        - $ref: "#/components/schemas/Impegni"
      description: "Body di inserimento. Obbligatori secondo il manuale: non indicati."
    ImpegniModifica:
      allOf:
        - $ref: "#/components/schemas/Impegni"
      description: "Body di revisione: solo i campi da modificare."
      x-mexal-obbligatori-put: []
    Filtro:
      type: object
      required:
        - campo
        - condizione
        - valore
      properties:
        campo:
          type: string
          description: Nome del campo su cui filtrare.
        indice1:
          type: integer
          minimum: 1
          description: Indice del primo livello, per i campi array.
        indice2:
          type: integer
          minimum: 1
          description: Indice del secondo livello, per gli array a due livelli.
        condizione:
          type: string
          enum:
            - "="
            - "<>"
            - ">"
            - "<"
            - ">="
            - "<="
            - contiene
            - inizia_per
        case_insensitive:
          type: boolean
          default: false
          description: Solo per i confronti fra stringhe.
        valore:
          description: "Valore da confrontare; un array mette i valori in OR. Date come AAAAMMGG."
          anyOf:
            - type: string
            - type: number
            - type: array
              minItems: 1
              items:
                type:
                  - string
                  - number
    Errore:
      type: object
      properties:
        error:
          type: object
          properties:
            response-code:
              type: integer
            response-detail:
              type: string
              description: "Codice numerico + messaggio: \"<codice> - <messaggio> [<dettaglio>]\". 6001 = errore gestionale."
            response-message:
              type: string
            request-uri:
              type: string
            request-method:
              type: string
            request-id:
              type: string
              description: UUID da citare al supporto.
            warsion:
              type: string
            remote:
              type: string
            timestamp:
              type: string
