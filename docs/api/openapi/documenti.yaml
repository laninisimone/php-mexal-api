openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Documenti
  version: "88201"
  description: |-
    Generato da `tools/api-docs/genera.php` a partire dall'help in linea (`GET /risorse/help?extended=true`)
    e da `?info=true` di un'installazione Mexal/Passcom 2.9.17 (versione gestionale 88201), integrato con il manuale WebAPI v3.1.
    Endpoint e campi dipendono da versione e moduli installati: la fonte di verità resta `?info=true`.

    **Convenzioni**

    - Autenticazione: `Authorization: Passepartout <base64(utente:password)>`; sul cloud si aggiunge ` Dominio=<DOMINIO>`.
    - Contesto aziendale: header `Coordinate-Gestionale: Azienda=XXX Anno=AAAA` (opzionali `SottoAzienda=`, `Magazzino=`).
    - Date `AAAAMMGG`, date-ora `AAAAMMGG HHMMSS`, decimali con il punto.
    - Gli array sono liste di coppie `[[indice, valore], ...]`, non liste semplici.
    - Chiavi composte unite da `+` nel path (es. `OC+1+15`). Codici con `/` o `\` vanno in esadecimale con `?encoding=hex`.
    - Paginazione: `max` limita i record, il token `next` della risposta va ripassato così com'è e subito.
    - Ricerca: `POST .../ricerca` con `filtri`; i filtri sono in AND, i valori di uno stesso filtro in OR.
    - Revisione (PUT): rimandare `data_ult_mod` letto dalla GET per il controllo di modifica concorrente.
    - Limiti: 5 richieste simultanee per utente WebAPI (oltre si riceve 503).
servers:
  - url: "https://{host}:{porta}/webapi/risorse"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi/risorse"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
tags:
  - name: documenti/moduli-stampa
    description: "Moduli di stampa disponibili per le sigle documento (da usare in cod_modulo). L'endpoint non supporta ?info=true: campi dedotti dalla struttura della risposta."
  - name: documenti/ordini-clienti
    description: "Ordini clienti (sigle OC, OX). La lista restituisce le testate; il singolo documento restituisce testata e righe, con le righe come variabili array [[indice_riga, valore], ...]."
  - name: documenti/ordini-clienti/righe
    description: Vista trasversale delle righe di tutti gli ordini clienti.
  - name: documenti/ordini-fornitori
    description: Ordini fornitori (sigla OF). Stessa struttura degli ordini clienti.
  - name: documenti/ordini-fornitori/righe
    description: Vista trasversale delle righe di tutti gli ordini fornitori.
  - name: documenti/ordini-matrici
    description: Ordini matrice (sigle MA, MF, MX). Stessa struttura degli ordini clienti.
  - name: documenti/ordini-matrici/righe
    description: Vista trasversale delle righe di tutti gli ordini matrice.
  - name: documenti/preventivi
    description: Preventivi (sigle PC, PF, PR, PX). Stessa struttura degli ordini clienti.
  - name: documenti/preventivi/righe
    description: Vista trasversale delle righe di tutti i preventivi.
  - name: documenti/movimenti-magazzino
    description: "Movimenti di magazzino: DDT, fatture, carichi, scarichi (sigla di 2 lettere, es. BC, BF, FT). Supporta la trasformazione da altri documenti con ?sigla_trasformazione."
  - name: documenti/movimenti-magazzino/righe
    description: Vista trasversale delle righe di tutti i movimenti di magazzino.
  - name: documenti/lavorazione/prodotti
    description: "Prodotti in lavorazione (sola lettura). Richiede un'azienda di livello produzione. Campi non disponibili: interrogare ?info=true su un'installazione che abiliti la risorsa (6001 - errore gestionale [cmd lista_prodotti_in_lavorazione disponibile solo per aziende di livello produzione o superiore])."
  - name: documenti/lavorazione/bolle
    description: "Bolle di lavorazione. Richiede un'azienda di livello produzione. Campi non disponibili: interrogare ?info=true su un'installazione che abiliti la risorsa (6001 - errore gestionale [cmd lista_bolle_lavorazione disponibile solo per aziende di livello produzione o superiore])."
  - name: documenti/lavorazione/impegni
    description: "Impegni di materiale delle bolle di lavorazione, chiave a 8 segmenti. Richiede un'azienda di livello produzione. Campi ricavati dal manuale WebAPI v3.1: l'installazione interrogata non li espone con ?info=true (6001 - errore gestionale [cmd lista_impegni disponibile solo per aziende di livello produzione o superiore])."
paths:
  "/documenti/moduli-stampa":
    get:
      tags:
        - documenti/moduli-stampa
      operationId: documenti_moduli_stampa_lista
      summary: Lettura modulo stampa
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DocumentiModuliStampaCampo"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                type: object
                properties:
                  elenco_moduli_stampa_disponibili:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentiModuliStampa"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "86500"
  "/documenti/moduli-stampa/{in_sigla_doc}":
    get:
      tags:
        - documenti/moduli-stampa
      operationId: documenti_moduli_stampa_leggi
      summary: Lettura modulo stampa
      parameters:
        - name: in_sigla_doc
          in: path
          required: true
          description: "Parte di chiave `in_sigla_doc`."
          schema:
            type: string
            pattern: "^[A-Z]*$"
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DocumentiModuliStampaCampo"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/DocumentiModuliStampa"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "86500"
  "/documenti/ordini-clienti":
    get:
      tags:
        - documenti/ordini-clienti
      operationId: documenti_ordini_clienti_lista
      summary: Lista ordini clienti
      description: |-
        Restituisce l’elenco delle testate ordini clienti. Supporta max, next, fields.

        Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento.
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DocumentiOrdiniClientiCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/DocumentiOrdiniClientiLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
    post:
      tags:
        - documenti/ordini-clienti
      operationId: documenti_ordini_clienti_crea
      summary: Inserimento ordine cliente
      description: |-
        Risponde 201 senza body: il codice assegnato è nell'header `Location`.

        Il numero viene assegnato automaticamente dal gestionale
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: sigla_trasformazione
          in: query
          description: Trasforma i documenti di origine indicati nelle righe (sigla_doc_orig, serie_doc_orig, numero_doc_orig, id_rif_testata, dt_ult_mod_orig) nella sigla indicata, gestendo evasione e residui. Prevale sulla sigla del body.
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/DocumentiOrdiniClientiInserimento"
      responses:
        "201":
          description: "Creato. Nessun body: il path della nuova risorsa è nell'header Location."
          headers:
            Location:
              description: "Path della risorsa creata (es. /webapi/risorse/documenti/ordini-clienti/...). Può contenere ?encoding=hex."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
  "/documenti/ordini-clienti/ricerca":
    post:
      tags:
        - documenti/ordini-clienti
      operationId: documenti_ordini_clienti_cerca
      summary: Ricerca ordini clienti
      description: |-
        Ricerca con filtri nel body. Supporta max, next, fields.

        Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`.
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DocumentiOrdiniClientiCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/DocumentiOrdiniClientiRicerca"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/DocumentiOrdiniClientiLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
  "/documenti/ordini-clienti/{sigla}+{serie}+{numero}":
    get:
      tags:
        - documenti/ordini-clienti
      operationId: documenti_ordini_clienti_leggi
      summary: Lettura ordine cliente
      parameters:
        - name: sigla
          in: path
          required: true
          description: "Parte di chiave `sigla`."
          schema:
            type: string
            enum:
              - OC
              - OX
        - name: serie
          in: path
          required: true
          description: "Parte di chiave `serie`."
          schema:
            type: integer
            minimum: 0
        - name: numero
          in: path
          required: true
          description: "Parte di chiave `numero`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DocumentiOrdiniClientiCampo"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/DocumentiOrdiniClientiDocumento"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
    put:
      tags:
        - documenti/ordini-clienti
      operationId: documenti_ordini_clienti_modifica
      summary: Modifica ordine cliente
      description: |-
        Aggiorna testata e/o righe dell’ordine.

        Indicare sempre tutti gli `id_riga` e `tp_riga`, anche delle righe non modificate: le righe omesse vengono cancellate. Con `?solo_testata=true` le righe sono preservate.
      parameters:
        - name: sigla
          in: path
          required: true
          description: "Parte di chiave `sigla`."
          schema:
            type: string
            enum:
              - OC
              - OX
        - name: serie
          in: path
          required: true
          description: "Parte di chiave `serie`."
          schema:
            type: integer
            minimum: 0
        - name: numero
          in: path
          required: true
          description: "Parte di chiave `numero`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: solo_testata
          in: query
          description: Se true modifica solo la testata e preserva le righe anche se omesse dal body.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/DocumentiOrdiniClientiModifica"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
    delete:
      tags:
        - documenti/ordini-clienti
      operationId: documenti_ordini_clienti_elimina
      summary: Cancellazione ordine cliente
      description: Elimina l’ordine.
      parameters:
        - name: sigla
          in: path
          required: true
          description: "Parte di chiave `sigla`."
          schema:
            type: string
            enum:
              - OC
              - OX
        - name: serie
          in: path
          required: true
          description: "Parte di chiave `serie`."
          schema:
            type: integer
            minimum: 0
        - name: numero
          in: path
          required: true
          description: "Parte di chiave `numero`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
