      type: string
      enum:
        - parametri_contabili
        - parametri_magazzino
        - parametri_produzione
      description: Campi di dati-generali/parametri-aziendali.
    Filtro:
      type: object
      required:
        - campo
        - condizione
        - valore
      properties:
        campo:
          type: string
          description: Nome del campo su cui filtrare.
        indice1:
          type: integer
          minimum: 1
          description: Indice del primo livello, per i campi array.
        indice2:
          type: integer
          minimum: 1
          description: Indice del secondo livello, per gli array a due livelli.
        condizione:
          type: string
          enum:
            - "="
            - "<>"
            - ">"
            - "<"
            - ">="
            - "<="
            - contiene
            - inizia_per
        case_insensitive:
          type: boolean
          default: false
          description: Solo per i confronti fra stringhe.
        valore:
          description: "Valore da confrontare; un array mette i valori in OR. Date come AAAAMMGG."
          anyOf:
            - type: string
            - type: number
            - type: array
              minItems: 1
              items:
                type:
                  - string
                  - number
    Errore:
      type: object
      properties:
        error:
          type: object
          properties:
            response-code:
              type: integer
            response-detail:
              type: string
              description: "Codice numerico + messaggio: \"<codice> - <messaggio> [<dettaglio>]\". 6001 = errore gestionale."
            response-message:
              type: string
            request-uri:
              type: string
            request-method:
              type: string
            request-id:
              type: string
              description: UUID da citare al supporto.
            warsion:
              type: string
            remote:
              type: string
            timestamp:
              type: string
