openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Mappa articoli
  version: "88201"
  description: |-
    Generato da `tools/api-docs/genera.php` a partire dall'help in linea (`GET /risorse/help?extended=true`)
    e da `?info=true` di un'installazione Mexal/Passcom 2.9.17 (versione gestionale 88201), integrato con il manuale WebAPI v3.1.
    Endpoint e campi dipendono da versione e moduli installati: la fonte di verità resta `?info=true`.

    **Convenzioni**

    - Autenticazione: `Authorization: Passepartout <base64(utente:password)>`; sul cloud si aggiunge ` Dominio=<DOMINIO>`.
    - Contesto aziendale: header `Coordinate-Gestionale: Azienda=XXX Anno=AAAA` (opzionali `SottoAzienda=`, `Magazzino=`).
    - Date `AAAAMMGG`, date-ora `AAAAMMGG HHMMSS`, decimali con il punto.
    - Gli array sono liste di coppie `[[indice, valore], ...]`, non liste semplici.
    - Chiavi composte unite da `+` nel path (es. `OC+1+15`). Codici con `/` o `\` vanno in esadecimale con `?encoding=hex`.
    - Paginazione: `max` limita i record, il token `next` della risposta va ripassato così com'è e subito.
    - Ricerca: `POST .../ricerca` con `filtri`; i filtri sono in AND, i valori di uno stesso filtro in OR.
    - Revisione (PUT): rimandare `data_ult_mod` letto dalla GET per il controllo di modifica concorrente.
    - Limiti: 5 richieste simultanee per utente WebAPI (oltre si riceve 503).
servers:
  - url: "https://{host}:{porta}/webapi/risorse"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi/risorse"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
tags:
  - name: mappa-articoli
    description: Ubicazione degli articoli nei magazzini e parametri di scorta.
paths:
  "/mappa-articoli":
    get:
      tags:
        - mappa-articoli
      operationId: mappa_articoli_lista
      summary: Ubicazione articoli
      description: |-
        Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento.

        Richiede header Coordinate-Gestionale con almeno Azienda e Anno

        Supporta paginazione tramite max e next (vedi Paginazione)

        Supporta selezione campi tramite parametro fields

        Le date sono restituite in formato stringa AAAAMMGG (vuoto se non valorizzate)

        Un articolo può comparire più volte se presente in più magazzini/ubicazioni
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/MappaArticoliCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/MappaArticoliLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "83000"
  "/mappa-articoli/ricerca":
    post:
      tags:
        - mappa-articoli
      operationId: mappa_articoli_cerca
      summary: Ricerca ubicazione articoli
      description: |-
        Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`.

        Il campo filtri nel body è obbligatorio e deve contenere almeno un oggetto filtro

        È possibile filtrare per qualsiasi campo della risorsa (es. codice, nr_magazzino, cod_ubicazione)

        Supporta le condizioni standard: =, <, <=, >, >=, <>, contiene, inizia_per

        Per la sintassi completa dei filtri, vedi Ricerca e Filtri
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/MappaArticoliCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/MappaArticoliRicerca"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/MappaArticoliLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "83000"
components:
  securitySchemes:
    passepartout:
      type: apiKey
      in: header
      name: Authorization
      description: "Formato `Passepartout <base64(utente:password)>`. Sul cloud: `Passepartout <base64> Dominio=<DOMINIO>`. Con login di sistema operativo attivo (login=1) si aggiunge un secondo blocco `<base64(utente_so:password_so)>`."
  parameters:
    CoordinateGestionale:
      name: Coordinate-Gestionale
      in: header
      required: true
      description: Azienda e anno di lavoro, più sotto-azienda e magazzino di default facoltativi (magazzino 1 se omesso).
      schema:
        type: string
        pattern: "^Azienda=\\S+( SottoAzienda=\\S+)? Anno=\\d{4}( Magazzino=\\d+)?$"
        examples:
          - "Azienda=DEM Anno=2026 Magazzino=1"
    Max:
      name: max
      in: query
      description: Numero massimo di record per pagina. Il server può restituirne meno (limiti di 30 s e 50 MB).
      schema:
        type: integer
        minimum: 1
    Next:
      name: next
      in: query
      description: "Token di pagina restituito dalla risposta precedente: opaco, da usare subito e così com'è."
      schema:
        type: string
    Encoding:
      name: encoding
      in: query
      description: "Codifica delle parti di chiave nel path. Obbligatoria quando un codice contiene `/` o `\\`: il codice va inviato in esadecimale (es. `ARTI/S` -> `415254492f53`)."
      schema:
        type: string
        enum:
          - hex
          - base32
  responses:
    ErroreRichiesta:
      description: "Richiesta non valida: parametri o campi errati, errore gestionale (6001), coordinate mancanti."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonAutorizzato:
      description: "Credenziali assenti o errate. Attenzione: tentativi ripetuti bloccano l'utente WebAPI."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonTrovato:
      description: Risorsa inesistente o path non valido (nessun body).
    PoolEsaurito:
      description: "Pool di 5 servizi dell'utente WebAPI esaurito: riprovare più tardi, senza retry aggressivi."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    MappaArticoli:
      type: object
      properties:
        codice:
          type: string
          description: "Codice articolo. Valori da articoli.codice. Codice dell'articolo a cui si riferisce il record (negli abbinati: l'articolo abbinato). Campo chiave."
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa: articoli
            campo: codice
            nota: "Codice dell'articolo a cui si riferisce il record (negli abbinati: l'articolo abbinato)"
        nr_magazzino:
          type: integer
          description: Numero magazzino.
          x-mexal-tipo: Numerico
        cod_ubicazione:
          type: string
          description: Ubicazione.
          x-mexal-tipo: Alfanumerico
        cod_sotto_ubic:
          type: string
          description: Sotto ubicazione.
          x-mexal-tipo: Alfanumerico
        id_ubicazione:
          type: integer
          description: "Id Ubicazione. Valori da ubicazioni.id. 0 = nessuna ubicazione."
          x-mexal-tipo: Numerico
          x-mexal-riferimento:
            risorsa: ubicazioni
            campo: id
            nota: "0 = nessuna ubicazione"
        dt_ult_carico:
          type: string
          description: Ultima data di carico. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        dt_ult_scarico:
          type: string
          description: Ultima data di scarico. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        dt_ult_ordine:
          type: string
          description: Ultima data ordini/imp. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        dt_ult_mov:
          type: string
          description: Ultima data movimenti. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        scorta_massima:
          type: integer
          description: Scorta minima.
          x-mexal-tipo: Numerico
        scorta_minima:
          type: integer
          description: Scorta massima.
          x-mexal-tipo: Numerico
        dt_ult_car_prec:
          type: string
          description: Ultima data di carico precedente. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        utente_ult_mod:
          type: string
          description: Utente ultima modifica.
          x-mexal-tipo: Alfanumerico
        data_ult_mod:
          type: string
          pattern: "^(\\d{8} \\d{6})?$"
          description: Data ora ultima modifica. Formato AAAAMMGG HHMMSS.
          x-mexal-tipo: Data e ora
      x-mexal-origine-campi: info
    MappaArticoliCampo:
      type: string
      enum:
        - codice
        - nr_magazzino
        - cod_ubicazione
        - cod_sotto_ubic
        - id_ubicazione
        - dt_ult_carico
        - dt_ult_scarico
        - dt_ult_ordine
        - dt_ult_mov
        - scorta_massima
        - scorta_minima
        - dt_ult_car_prec
        - utente_ult_mod
        - data_ult_mod
      description: Campi di mappa-articoli.
    MappaArticoliLista:
      type: object
      required:
        - dati
      properties:
        dati:
          type: array
          items:
            $ref: "#/components/schemas/MappaArticoli"
        data_ric_elab:
          type: string
          description: Timestamp di elaborazione, AAAAMMGG HHMMSS.
        next:
          type: string
          description: "Presente solo se ci sono altre pagine: da passare così com'è nel parametro next."
    MappaArticoliRicerca:
      type: object
      required:
        - filtri
      properties:
        filtri:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/Filtro"
              - properties:
                  campo:
                    $ref: "#/components/schemas/MappaArticoliCampo"
    Filtro:
      type: object
      required:
        - campo
        - condizione
        - valore
      properties:
        campo:
          type: string
          description: Nome del campo su cui filtrare.
        indice1:
          type: integer
          minimum: 1
          description: Indice del primo livello, per i campi array.
        indice2:
          type: integer
          minimum: 1
          description: Indice del secondo livello, per gli array a due livelli.
        condizione:
          type: string
          enum:
            - "="
            - "<>"
            - ">"
            - "<"
            - ">="
            - "<="
            - contiene
            - inizia_per
        case_insensitive:
          type: boolean
          default: false
          description: Solo per i confronti fra stringhe.
        valore:
          description: "Valore da confrontare; un array mette i valori in OR. Date come AAAAMMGG."
          anyOf:
            - type: string
            - type: number
            - type: array
              minItems: 1
              items:
                type:
                  - string
                  - number
    Errore:
      type: object
      properties:
        error:
          type: object
          properties:
            response-code:
              type: integer
            response-detail:
              type: string
              description: "Codice numerico + messaggio: \"<codice> - <messaggio> [<dettaglio>]\". 6001 = errore gestionale."
            response-message:
              type: string
            request-uri:
              type: string
            request-method:
              type: string
            request-id:
              type: string
              description: UUID da citare al supporto.
            warsion:
              type: string
            remote:
              type: string
            timestamp:
              type: string
