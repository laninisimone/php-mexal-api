        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
    put:
      tags:
        - referenti/clienti
      operationId: referenti_clienti_modifica
      summary: Modifica referenti cliente
      description: "Inviare solo i campi da modificare, più `data_ult_mod` letto dalla GET se il controllo di modifica concorrente è attivo."
      parameters:
