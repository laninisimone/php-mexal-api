        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81500"
  "/referenti/clienti/{codice_cli_for}+{cod_referente}":
    get:
      tags:
        - referenti/clienti
      operationId: referenti_clienti_leggi
      summary: Lettura referenti cliente
