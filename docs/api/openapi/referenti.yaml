components:
  securitySchemes:
    passepartout:
      type: apiKey
      in: header
      name: Authorization
      description: "Formato `Passepartout <base64(utente:password)>`. Sul cloud: `Passepartout <base64> Dominio=<DOMINIO>`. Con login di sistema operativo attivo (login=1) si aggiunge un secondo blocco `<base64(utente_so:password_so)>`."
  parameters:
    CoordinateGestionale:
      name: Coordinate-Gestionale
      in: header
      required: true
      description: Azienda e anno di lavoro, più sotto-azienda e magazzino di default facoltativi (magazzino 1 se omesso).
      schema:
        type: string
        pattern: "^Azienda=\\S+( SottoAzienda=\\S+)? Anno=\\d{4}( Magazzino=\\d+)?$"
        examples:
          - "Azienda=DEM Anno=2026 Magazzino=1"
    Max:
      name: max
      in: query
      description: Numero massimo di record per pagina. Il server può restituirne meno (limiti di 30 s e 50 MB).
      schema:
        type: integer
        minimum: 1
    Next:
      name: next
      in: query
      description: "Token di pagina restituito dalla risposta precedente: opaco, da usare subito e così com'è."
      schema:
        type: string
    Encoding:
      name: encoding
      in: query
      description: "Codifica delle parti di chiave nel path. Obbligatoria quando un codice contiene `/` o `\\`: il codice va inviato in esadecimale (es. `ARTI/S` -> `415254492f53`)."
      schema:
        type: string
        enum:
          - hex
          - base32
  responses:
    ErroreRichiesta:
      description: "Richiesta non valida: parametri o campi errati, errore gestionale (6001), coordinate mancanti."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonAutorizzato:
      description: "Credenziali assenti o errate. Attenzione: tentativi ripetuti bloccano l'utente WebAPI."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonTrovato:
      description: Risorsa inesistente o path non valido (nessun body).
    PoolEsaurito:
      description: "Pool di 5 servizi dell'utente WebAPI esaurito: riprovare più tardi, senza retry aggressivi."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    ReferentiClienti:
      type: object
      properties:
        codice_cli_for:
          type: string
          description: "Codice del cliente/fornitore; si può inserire anche un codice contatto — Codice cliente (o contatto). Valori da clienti.codice. Ammesso anche un codice dell'anagrafica contatti. Campo chiave."
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa: clienti
            campo: codice
            nota: Ammesso anche un codice dell'anagrafica contatti
        cod_referente:
          type: integer
          description: Codice referente - è il collegamento fra referente registrato e array. Campo chiave.
          x-mexal-tipo: Numerico
        cod_posizione:
          type: integer
          description: Codice posizione referente in tabella posizioni. Valori da dati-generali/posizione-referenti.id.
          x-mexal-tipo: Numerico
          x-mexal-riferimento:
            risorsa: dati-generali/posizione-referenti
            campo: id
        nome:
          type: string
          description: Nome referente.
          x-mexal-tipo: Alfanumerico
        nota:
          type: string
          description: Nota referente.
          x-mexal-tipo: Alfanumerico
        telefono:
          type: string
          description: Telefono referente.
          x-mexal-tipo: Alfanumerico
        cellulare:
          type: string
          description: "Cellulare referente - per l'azzeramento occorre impostare con uno spazio = ' '."
          x-mexal-tipo: Alfanumerico
        fax:
          type: string
          description: Fax referente.
          x-mexal-tipo: Alfanumerico
        email:
          type: string
          description: "Indirizzo e-mail referente — Email."
          x-mexal-tipo: Alfanumerico
        url:
          type: string
          description: Indirizzo internet referente.
          x-mexal-tipo: Alfanumerico
        tipo:
          type: string
          description: Tipo referente.
          x-mexal-tipo: Alfanumerico
      x-mexal-origine-campi: info
    ReferentiClientiCampo:
      type: string
      enum:
        - codice_cli_for
        - cod_referente
        - cod_posizione
        - nome
        - nota
        - telefono
        - cellulare
        - fax
        - email
        - url
        - tipo
      description: Campi di referenti/clienti.
    ReferentiClientiLista:
      type: object
      required:
        - dati
      properties:
        dati:
          type: array
          items:
            $ref: "#/components/schemas/ReferentiClienti"
        data_ric_elab:
          type: string
          description: Timestamp di elaborazione, AAAAMMGG HHMMSS.
        next:
          type: string
          description: "Presente solo se ci sono altre pagine: da passare così com'è nel parametro next."
    ReferentiClientiRicerca:
      type: object
      required:
        - filtri
      properties:
        filtri:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/Filtro"
              - properties:
                  campo:
                    $ref: "#/components/schemas/ReferentiClientiCampo"
    ReferentiClientiInserimento:
      allOf:
        - $ref: "#/components/schemas/ReferentiClienti"
      required:
        - codice_cli_for
      description: "Body di inserimento. Obbligatori secondo il manuale: codice_cli_for."
    ReferentiClientiModifica:
      allOf:
        - $ref: "#/components/schemas/ReferentiClienti"
      description: "Body di revisione: solo i campi da modificare. Campi da indicare sempre secondo ?info=true: codice_cli_for, cod_referente."
      x-mexal-obbligatori-put:
        - codice_cli_for
        - cod_referente
    ReferentiFornitori:
      type: object
      properties:
        codice_cli_for:
          type: string
          description: "Codice del cliente/fornitore; si può inserire anche un codice contatto. Valori da fornitori.codice. Ammesso anche un codice dell'anagrafica contatti. Campo chiave."
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa: fornitori
            campo: codice
            nota: Ammesso anche un codice dell'anagrafica contatti
        cod_referente:
          type: integer
          description: Codice referente - è il collegamento fra referente registrato e array. Campo chiave.
          x-mexal-tipo: Numerico
        cod_posizione:
          type: integer
          description: Codice posizione referente in tabella posizioni. Valori da dati-generali/posizione-referenti.id.
          x-mexal-tipo: Numerico
          x-mexal-riferimento:
            risorsa: dati-generali/posizione-referenti
            campo: id
        nome:
          type: string
          description: Nome referente.
          x-mexal-tipo: Alfanumerico
        nota:
          type: string
          description: Nota referente.
          x-mexal-tipo: Alfanumerico
        telefono:
          type: string
          description: Telefono referente.
          x-mexal-tipo: Alfanumerico
        cellulare:
          type: string
          description: "Cellulare referente - per l'azzeramento occorre impostare con uno spazio = ' '."
          x-mexal-tipo: Alfanumerico
        fax:
          type: string
          description: Fax referente.
          x-mexal-tipo: Alfanumerico
        email:
          type: string
          description: Indirizzo e-mail referente.
          x-mexal-tipo: Alfanumerico
        url:
          type: string
          description: Indirizzo internet referente.
          x-mexal-tipo: Alfanumerico
        tipo:
          type: string
          description: Tipo referente.
          x-mexal-tipo: Alfanumerico
      x-mexal-origine-campi: info
    ReferentiFornitoriCampo:
      type: string
      enum:
        - codice_cli_for
        - cod_referente
        - cod_posizione
        - nome
        - nota
        - telefono
        - cellulare
        - fax
        - email
        - url
        - tipo
      description: Campi di referenti/fornitori.
    ReferentiFornitoriLista:
      type: object
      required:
        - dati
      properties:
        dati:
          type: array
          items:
            $ref: "#/components/schemas/ReferentiFornitori"
        data_ric_elab:
          type: string
          description: Timestamp di elaborazione, AAAAMMGG HHMMSS.
        next:
          type: string
          description: "Presente solo se ci sono altre pagine: da passare così com'è nel parametro next."
    ReferentiFornitoriRicerca:
      type: object
      required:
        - filtri
      properties:
        filtri:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/Filtro"
              - properties:
                  campo:
                    $ref: "#/components/schemas/ReferentiFornitoriCampo"
    ReferentiFornitoriInserimento:
      allOf:
        - $ref: "#/components/schemas/ReferentiFornitori"
      description: "Body di inserimento. Obbligatori secondo il manuale: non indicati."
    ReferentiFornitoriModifica:
      allOf:
        - $ref: "#/components/schemas/ReferentiFornitori"
      description: "Body di revisione: solo i campi da modificare. Campi da indicare sempre secondo ?info=true: codice_cli_for, cod_referente."
      x-mexal-obbligatori-put:
        - codice_cli_for
        - cod_referente
    Filtro:
      type: object
      required:
        - campo
        - condizione
        - valore
      properties:
        campo:
          type: string
          description: Nome del campo su cui filtrare.
        indice1:
          type: integer
          minimum: 1
          description: Indice del primo livello, per i campi array.
        indice2:
          type: integer
          minimum: 1
          description: Indice del secondo livello, per gli array a due livelli.
        condizione:
          type: string
          enum:
            - "="
            - "<>"
            - ">"
            - "<"
            - ">="
            - "<="
            - contiene
            - inizia_per
        case_insensitive:
          type: boolean
          default: false
          description: Solo per i confronti fra stringhe.
        valore:
          description: "Valore da confrontare; un array mette i valori in OR. Date come AAAAMMGG."
          anyOf:
            - type: string
            - type: number
            - type: array
              minItems: 1
              items:
                type:
                  - string
                  - number
    Errore:
      type: object
      properties:
        error:
          type: object
          properties:
            response-code:
              type: integer
            response-detail:
              type: string
              description: "Codice numerico + messaggio: \"<codice> - <messaggio> [<dettaglio>]\". 6001 = errore gestionale."
            response-message:
              type: string
            request-uri:
              type: string
            request-method:
              type: string
            request-id:
              type: string
              description: UUID da citare al supporto.
            warsion:
              type: string
            remote:
              type: string
            timestamp:
              type: string
