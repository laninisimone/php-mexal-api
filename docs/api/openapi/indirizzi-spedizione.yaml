openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Indirizzi spedizione
  version: "88201"
  description: |-
    Generato da `tools/api-docs/genera.php` a partire dall'help in linea (`GET /risorse/help?extended=true`)
    e da `?info=true` di un'installazione Mexal/Passcom 2.9.17 (versione gestionale 88201), integrato con il manuale WebAPI v3.1.
    Endpoint e campi dipendono da versione e moduli installati: la fonte di verità resta `?info=true`.

    **Convenzioni**

    - Autenticazione: `Authorization: Passepartout <base64(utente:password)>`; sul cloud si aggiunge ` Dominio=<DOMINIO>`.
    - Contesto aziendale: header `Coordinate-Gestionale: Azienda=XXX Anno=AAAA` (opzionali `SottoAzienda=`, `Magazzino=`).
    - Date `AAAAMMGG`, date-ora `AAAAMMGG HHMMSS`, decimali con il punto.
    - Gli array sono liste di coppie `[[indice, valore], ...]`, non liste semplici.
    - Chiavi composte unite da `+` nel path (es. `OC+1+15`). Codici con `/` o `\` vanno in esadecimale con `?encoding=hex`.
    - Paginazione: `max` limita i record, il token `next` della risposta va ripassato così com'è e subito.
    - Ricerca: `POST .../ricerca` con `filtri`; i filtri sono in AND, i valori di uno stesso filtro in OR.
    - Revisione (PUT): rimandare `data_ult_mod` letto dalla GET per il controllo di modifica concorrente.
    - Limiti: 5 richieste simultanee per utente WebAPI (oltre si riceve 503).
servers:
  - url: "https://{host}:{porta}/webapi/risorse"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi/risorse"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
tags:
  - name: indirizzi-spedizione
    description: Indirizzi di spedizione (destinazioni diverse) di clienti e fornitori.
paths:
  "/indirizzi-spedizione":
    get:
      tags:
        - indirizzi-spedizione
      operationId: indirizzi_spedizione_lista
      summary: Lista indirizzi di spedizione
      description: |-
        Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento.

        Supporta paginazione tramite max e next (vedi Paginazione)

        Il parametro fields permette di restituire solo i campi desiderati (es.
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IndirizziSpedizioneCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/IndirizziSpedizioneLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81600"
    post:
      tags:
        - indirizzi-spedizione
      operationId: indirizzi_spedizione_crea
      summary: Inserimento indirizzo di spedizione
      description: |-
        Risponde 201 senza body: il codice assegnato è nell'header `Location`.

        L’id viene assegnato automaticamente dal sistema

        Il campo cod_conto identifica il cliente/fornitore in formato mastro.sottoconto (es.
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/IndirizziSpedizioneInserimento"
      responses:
        "201":
          description: "Creato. Nessun body: il path della nuova risorsa è nell'header Location."
          headers:
            Location:
              description: "Path della risorsa creata (es. /webapi/risorse/indirizzi-spedizione/...). Può contenere ?encoding=hex."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81600"
  "/indirizzi-spedizione/ricerca":
    post:
      tags:
        - indirizzi-spedizione
      operationId: indirizzi_spedizione_cerca
      summary: Ricerca indirizzi di spedizione
      description: |-
        Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`.

        Il body deve contenere un array filtri con almeno un oggetto filtro

        Condizioni supportate: =, <>, <, <=, >, >=, contiene, inizia_per
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IndirizziSpedizioneCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/IndirizziSpedizioneRicerca"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/IndirizziSpedizioneLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81600"
  "/indirizzi-spedizione/{id}":
    get:
      tags:
        - indirizzi-spedizione
      operationId: indirizzi_spedizione_leggi
      summary: Lettura indirizzo di spedizione
      description: |-
        La chiave è di tipo stringa ed è encodable (supporta encoding per caratteri speciali)

        Supporta il parametro fields per selezionare i campi da restituire
      parameters:
        - name: id
          in: path
          required: true
          description: "Parte di chiave `id`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IndirizziSpedizioneCampo"
        - $ref: "#/components/parameters/Encoding"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/IndirizziSpedizione"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81600"
    put:
      tags:
        - indirizzi-spedizione
      operationId: indirizzi_spedizione_modifica
      summary: Modifica indirizzo di spedizione
      description: |-
        Inviare solo i campi da modificare, più `data_ult_mod` letto dalla GET se il controllo di modifica concorrente è attivo.

        La cancellazione (DELETE) non è supportata per questa entità

        Nel body inviare solo i campi da modificare
      parameters:
        - name: id
          in: path
          required: true
          description: "Parte di chiave `id`. Caratteri ASCII stampabili: se il valore contiene `/` o `\\` va inviato in esadecimale con `encoding=hex`."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/CoordinateGestionale"
        - $ref: "#/components/parameters/Encoding"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/IndirizziSpedizioneModifica"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "81600"
components:
  securitySchemes:
    passepartout:
      type: apiKey
      in: header
      name: Authorization
      description: "Formato `Passepartout <base64(utente:password)>`. Sul cloud: `Passepartout <base64> Dominio=<DOMINIO>`. Con login di sistema operativo attivo (login=1) si aggiunge un secondo blocco `<base64(utente_so:password_so)>`."
  parameters:
    CoordinateGestionale:
      name: Coordinate-Gestionale
      in: header
      required: true
      description: Azienda e anno di lavoro, più sotto-azienda e magazzino di default facoltativi (magazzino 1 se omesso).
      schema:
        type: string
        pattern: "^Azienda=\\S+( SottoAzienda=\\S+)? Anno=\\d{4}( Magazzino=\\d+)?$"
        examples:
          - "Azienda=DEM Anno=2026 Magazzino=1"
    Max:
      name: max
      in: query
      description: Numero massimo di record per pagina. Il server può restituirne meno (limiti di 30 s e 50 MB).
      schema:
        type: integer
        minimum: 1
    Next:
      name: next
      in: query
      description: "Token di pagina restituito dalla risposta precedente: opaco, da usare subito e così com'è."
      schema:
        type: string
    Encoding:
      name: encoding
      in: query
      description: "Codifica delle parti di chiave nel path. Obbligatoria quando un codice contiene `/` o `\\`: il codice va inviato in esadecimale (es. `ARTI/S` -> `415254492f53`)."
      schema:
        type: string
        enum:
          - hex
          - base32
  responses:
    ErroreRichiesta:
      description: "Richiesta non valida: parametri o campi errati, errore gestionale (6001), coordinate mancanti."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonAutorizzato:
      description: "Credenziali assenti o errate. Attenzione: tentativi ripetuti bloccano l'utente WebAPI."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonTrovato:
      description: Risorsa inesistente o path non valido (nessun body).
    PoolEsaurito:
      description: "Pool di 5 servizi dell'utente WebAPI esaurito: riprovare più tardi, senza retry aggressivi."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    IndirizziSpedizione:
      type: object
      properties:
        id:
          type: string
          description: "Codice indirizzo di spedizione — Identificativo numerico dell’indirizzo. Campo chiave."
          x-mexal-tipo: Alfanumerico
        cod_conto:
          type: string
          description: "Codice Cliente / Fornitore — Codice cliente/fornitore (formato mastro.sottoconto). Valori da clienti.codice o fornitori.codice. Cliente o fornitore a seconda della sigla documento (formato mastro.conto)."
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa:
              - clienti
              - fornitori
            campo: codice
            nota: Cliente o fornitore a seconda della sigla documento (formato mastro.conto)
        descrizione:
          type: string
          description: Descrizione / ragione sociale destinazione.
          x-mexal-tipo: Alfanumerico
        indirizzo:
          type: string
          description: Indirizzo di spedizione.
          x-mexal-tipo: Alfanumerico
        cap:
          type: string
          description: C.A.P.
          x-mexal-tipo: Alfanumerico
        localita:
          type: string
          description: "Localita' — Località (città)."
          x-mexal-tipo: Alfanumerico
        provincia:
          type: string
          description: Provincia (sigla).
          x-mexal-tipo: Alfanumerico
        tp_nazionalita:
          type: string
          description: "Nazionalita' — Nazionalità (es. I)."
          x-mexal-tipo: Alfanumerico
        cod_paese:
          type: string
          description: Codice paese (es. IT).
          x-mexal-tipo: Alfanumerico
        telefono:
          type: string
          description: Numero di telefono.
          x-mexal-tipo: Alfanumerico
        fax:
          type: string
          description: Numero di Fax.
          x-mexal-tipo: Alfanumerico
        email:
          type: string
          description: Indirizzo e-Mail.
          x-mexal-tipo: Alfanumerico
        url:
          type: string
          description: Indirizzo Internet.
          x-mexal-tipo: Alfanumerico
        chiusura_sett:
          type: string
          description: Chiusura settimanale o stringa libera.
          x-mexal-tipo: Alfanumerico
        riferimento:
          type: string
          description: "Riferimento — Persona di contatto."
          x-mexal-tipo: Alfanumerico
        cell_rif:
          type: string
          description: Numero di cellulare riferimento.
          x-mexal-tipo: Alfanumerico
        nota:
          type: string
          description: Note.
          x-mexal-tipo: Alfanumerico
        data_validita:
          type: string
          description: Data validita'. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        data_creazione:
          type: string
          description: Data creazione. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        data_modifica:
          type: string
          description: Data aggiornamento. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        cod_conto_sost:
          type: string
          description: Codice Cliente / Fornitore sostitutivo. Valori da clienti.codice o fornitori.codice. Cliente o fornitore a seconda della sigla documento (formato mastro.conto).
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa:
              - clienti
              - fornitori
            campo: codice
            nota: Cliente o fornitore a seconda della sigla documento (formato mastro.conto)
        id_ind_sost:
          type: string
          description: Codice indirizzo di spedizione sostitutivo.
          x-mexal-tipo: Alfanumerico
        annullato:
          type: string
          description: Annullato.
          x-mexal-tipo: Alfanumerico
        gest_raggruppa:
          type: string
          description: Raggruppa documenti S/N.
          x-mexal-tipo: Alfanumerico
        codice_cig:
          type: string
          description: Codice CIG.
          x-mexal-tipo: Alfanumerico
        codice_cup:
          type: string
          description: Codice CUP.
          x-mexal-tipo: Alfanumerico
        rif_esterno_tp:
          type: string
          description: Riferimenti esterni tipo.
          x-mexal-tipo: Alfanumerico
        rif_esterno_sgl:
          type: string
          description: Riferimenti esterni sigla.
          x-mexal-tipo: Alfanumerico
        rif_esterno_nr:
          type: string
          description: Riferimenti esterni numero.
          x-mexal-tipo: Alfanumerico
        rif_esterno_cod:
          type: string
          description: Riferimenti esterni codice.
          x-mexal-tipo: Alfanumerico
        rif_esterno_dt:
          type: string
          description: Riferimenti esterni data.
          x-mexal-tipo: Alfanumerico
        tp_indirizzo:
          type: string
          description: Tipo Indirizzo'.
          x-mexal-tipo: Alfanumerico
        utente_ult_mod:
          type: string
          description: Utente ultima modifica.
          x-mexal-tipo: Alfanumerico
        data_ult_mod:
          type: string
          pattern: "^(\\d{8} \\d{6})?$"
          description: Data ora ultima modifica. Formato AAAAMMGG HHMMSS.
          x-mexal-tipo: Data e ora
      x-mexal-origine-campi: info
    IndirizziSpedizioneCampo:
      type: string
      enum:
        - id
        - cod_conto
        - descrizione
        - indirizzo
        - cap
        - localita
        - provincia
        - tp_nazionalita
        - cod_paese
        - telefono
        - fax
        - email
        - url
        - chiusura_sett
        - riferimento
        - cell_rif
        - nota
        - data_validita
        - data_creazione
        - data_modifica
        - cod_conto_sost
        - id_ind_sost
        - annullato
        - gest_raggruppa
        - codice_cig
        - codice_cup
        - rif_esterno_tp
        - rif_esterno_sgl
        - rif_esterno_nr
        - rif_esterno_cod
        - rif_esterno_dt
        - tp_indirizzo
        - utente_ult_mod
        - data_ult_mod
      description: Campi di indirizzi-spedizione.
    IndirizziSpedizioneLista:
      type: object
      required:
        - dati
      properties:
        dati:
          type: array
          items:
            $ref: "#/components/schemas/IndirizziSpedizione"
        data_ric_elab:
          type: string
          description: Timestamp di elaborazione, AAAAMMGG HHMMSS.
        next:
          type: string
          description: "Presente solo se ci sono altre pagine: da passare così com'è nel parametro next."
    IndirizziSpedizioneRicerca:
      type: object
      required:
        - filtri
      properties:
        filtri:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/Filtro"
              - properties:
                  campo:
                    $ref: "#/components/schemas/IndirizziSpedizioneCampo"
    IndirizziSpedizioneInserimento:
      allOf:
        - $ref: "#/components/schemas/IndirizziSpedizione"
      description: "Body di inserimento. Obbligatori secondo il manuale: non indicati."
    IndirizziSpedizioneModifica:
      allOf:
        - $ref: "#/components/schemas/IndirizziSpedizione"
      description: "Body di revisione: solo i campi da modificare. Campi da indicare sempre secondo ?info=true: id."
      x-mexal-obbligatori-put:
        - id
    Filtro:
      type: object
      required:
        - campo
        - condizione
        - valore
      properties:
        campo:
          type: string
          description: Nome del campo su cui filtrare.
        indice1:
          type: integer
          minimum: 1
          description: Indice del primo livello, per i campi array.
        indice2:
          type: integer
          minimum: 1
          description: Indice del secondo livello, per gli array a due livelli.
        condizione:
          type: string
          enum:
            - "="
            - "<>"
            - ">"
            - "<"
            - ">="
            - "<="
            - contiene
            - inizia_per
        case_insensitive:
          type: boolean
          default: false
          description: Solo per i confronti fra stringhe.
        valore:
          description: "Valore da confrontare; un array mette i valori in OR. Date come AAAAMMGG."
          anyOf:
            - type: string
            - type: number
            - type: array
              minItems: 1
              items:
                type:
                  - string
                  - number
    Errore:
      type: object
      properties:
        error:
          type: object
          properties:
            response-code:
              type: integer
            response-detail:
              type: string
              description: "Codice numerico + messaggio: \"<codice> - <messaggio> [<dettaglio>]\". 6001 = errore gestionale."
            response-message:
              type: string
            request-uri:
              type: string
            request-method:
              type: string
            request-id:
              type: string
              description: UUID da citare al supporto.
            warsion:
              type: string
            remote:
              type: string
            timestamp:
              type: string
