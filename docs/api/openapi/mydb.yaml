        Per filtrare sui campi dell’archivio (che sono array), utilizzare il campo dati_campi e specificare indice1 con il numero del campo da filtrare

        Supporta le stesse condizioni degli altri endpoint REST (vedi Ricerca e Filtri)

        I restanti metodi (PUT, DELETE) seguono la stessa logica, aggiungendo la sigla documento nel path

        Il formato dell’archivio è APP@nome_archivio dove APP è il codice dell’app Passbuilder (es.
      parameters:
        - name: nome_archivio
          in: path
          required: true
          description: "Parte di chiave `nome_archivio`."
          schema:
            type: string
            pattern: "^[a-zA-Z0-9]+@[a-zA-Z0-9]+$"
