    Filtro:
      type: object
      required:
        - campo
        - condizione
        - valore
      properties:
        campo:
          type: string
          description: Nome del campo su cui filtrare.
        indice1:
          type: integer
          minimum: 1
          description: Indice del primo livello, per i campi array.
        indice2:
          type: integer
          minimum: 1
          description: Indice del secondo livello, per gli array a due livelli.
        condizione:
          type: string
          enum:
            - "="
            - "<>"
            - ">"
            - "<"
            - ">="
            - "<="
            - contiene
            - inizia_per
        case_insensitive:
          type: boolean
          default: false
          description: Solo per i confronti fra stringhe.
        valore:
          description: "Valore da confrontare; un array mette i valori in OR. Date come AAAAMMGG."
          anyOf:
            - type: string
            - type: number
            - type: array
              minItems: 1
              items:
                type:
                  - string
                  - number
