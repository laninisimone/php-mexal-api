          description: Codice articolo. Valori da articoli.codice.
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa: articoli
            campo: codice
        descr_articolo:
          type: string
          description: Descrizione articolo.
          x-mexal-tipo: Alfanumerico
        id_magazzino:
          type: integer
          description: ID del magazzino. Valori da dati-generali/magazzini.id. Numero magazzino.
          x-mexal-tipo: Numerico
          x-mexal-riferimento:
            risorsa: dati-generali/magazzini
            campo: id
            nota: Numero magazzino
        id_ubicazione:
          type: integer
          description: "ID dell’ubicazione (presente solo se l’articolo ha ubicazione). Valori da ubicazioni.id. 0 = nessuna ubicazione."
          x-mexal-tipo: Numerico
          x-mexal-riferimento:
            risorsa: ubicazioni
            campo: id
            nota: "0 = nessuna ubicazione"
        id_lotto:
          type: integer
          description: ID del lotto/matricola (presente solo se l’articolo gestisce lotti). Valori da lotti.id.
          x-mexal-tipo: Numerico
          x-mexal-riferimento:
            risorsa: lotti
            campo: id
        um_principale:
          type: string
          description: Unità di misura principale.
          x-mexal-tipo: Alfanumerico
        um_secondaria:
          type: string
          description: Unità di misura secondaria (presente solo se definita).
          x-mexal-tipo: Alfanumerico
        qta_inventario:
          type: number
