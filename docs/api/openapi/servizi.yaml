openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Canale servizi
  version: "88201"
  description: |-
    Il canale `/servizi` non è RESTful: si invia sempre una POST con il comando in `cmd` e i parametri in `dati`
    (alcuni servizi vogliono parametri allo stesso livello di `cmd`). Il token `next` di paginazione viaggia nel body,
    accanto a `cmd`. Schemi ricavati dal manuale WebAPI v3.1: i servizi disponibili dipendono da versione e moduli.

    L'upload di file usa un endpoint diverso (`POST /webapi/uploads`, multipart/form-data) e non è descritto qui.

    **Servizi**

    - `esec_collage_server_remoto`: Collage Server Remoto
    - `sviluppo_distinta_base`: Sviluppo Distinta Base
    - `avanzamento_produzione`: Avanzamento di Produzione
    - `spezzariga_bl`: Spezza Riga Bolle di Lavorazione
    - `condizioni_documento`: Condizioni Documento
    - `calcolo_esposizione`: Calcolo Esposizione
    - `get_prog_ubicazioni`: Progressivi totale Ubicazioni
    - `totali_documento`: Totali Documento e Totali Riga
    - `totali_riga_documento`: Totali Documento e Totali Riga
    - `get_tabella_cap`: Località Italiane (CAP e Zone)
    - `get_tabella_zone`: Località Italiane (CAP e Zone)
    - `totali_nr_operazioni_contabili`: Conteggio Operazioni Contabili
    - `leggi_pratica_dr`: Pratiche Dichiarativi
    - `get_lista_pratiche_dr`: Pratiche Dichiarativi
    - `get_lista_deleghe`: Deleghe Dichiarativi
    - `cambia_stato_delega`: Deleghe Dichiarativi
    - `get_registro_operazioni_utente`: Registro Cancellati
    - `leggi_dichiarazione_iva_annuale`: Dichiarazioni IVA Annuali
    - `leggi_comunicazioni_lipe`: Lettura Comunicazioni LIPE
    - `stampa_ordine_cliente`: Stampa PDF di Documenti - Ordine cliente
    - `stampa_ordine_fornitore`: Stampa PDF di Documenti - Ordine fornitore
    - `stampa_preventivo`: Stampa PDF di Documenti - Preventivo
    - `stampa_ordine_matrice`: Stampa PDF di Documenti - Ordine matrice
    - `stampa_movimento_magazzino`: Stampa PDF di Documenti - Movimento di magazzino
    - `ins_righe_ordine_cliente`: Inserimento Righe nei Documenti - Ordine cliente
    - `ins_righe_ordine_fornitore`: Inserimento Righe nei Documenti - Ordine fornitore
    - `ins_righe_preventivo`: Inserimento Righe nei Documenti - Preventivo
    - `ins_righe_ordine_matrice`: Inserimento Righe nei Documenti - Ordine matrice
    - `ins_righe_movimento_magazzino`: Inserimento Righe nei Documenti - Movimento di magazzino
    - `lista_docdv`: Lista Allegati Docuvision
    - `get_allegato_archivio`: Lettura Allegati Docuvision
    - `get_assoc_dv`: Associazioni Docuvision
    - `lista_strutture_mydb`: Lista Strutture MyDB
    - `get_proprieta_numeratori`: Proprietà Numeratori
    - `verifica_autenticazione_mydb`: Autenticazione MyDB
    - `get_calendari_produzione`: Calendari di Produzione
    - `get_multilotto`: Multilotto
    - `cambia_iban_tipo_invio_delega`: Modifica IBAN e Tipo Invio
    - `inserisci_aggiorna_iban`: Inserimento-Aggiornamento IBAN
    - `get_storico_ordine`: Storia Ordine
servers:
  - url: "https://{host}:{porta}/webapi"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
paths:
  "/servizi":
    post:
      operationId: servizi
      summary: Esegue un servizio del gestionale
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              oneOf:
                - $ref: "#/components/schemas/ServizioEsecCollageServerRemoto"
                - $ref: "#/components/schemas/ServizioSviluppoDistintaBase"
                - $ref: "#/components/schemas/ServizioAvanzamentoProduzione"
                - $ref: "#/components/schemas/ServizioSpezzarigaBl"
                - $ref: "#/components/schemas/ServizioCondizioniDocumento"
                - $ref: "#/components/schemas/ServizioCalcoloEsposizione"
                - $ref: "#/components/schemas/ServizioGetProgUbicazioni"
                - $ref: "#/components/schemas/ServizioTotaliDocumento"
                - $ref: "#/components/schemas/ServizioTotaliRigaDocumento"
                - $ref: "#/components/schemas/ServizioGetTabellaCap"
                - $ref: "#/components/schemas/ServizioGetTabellaZone"
                - $ref: "#/components/schemas/ServizioTotaliNrOperazioniContabili"
                - $ref: "#/components/schemas/ServizioLeggiPraticaDr"
                - $ref: "#/components/schemas/ServizioGetListaPraticheDr"
                - $ref: "#/components/schemas/ServizioGetListaDeleghe"
                - $ref: "#/components/schemas/ServizioCambiaStatoDelega"
                - $ref: "#/components/schemas/ServizioGetRegistroOperazioniUtente"
                - $ref: "#/components/schemas/ServizioLeggiDichiarazioneIvaAnnuale"
                - $ref: "#/components/schemas/ServizioLeggiComunicazioniLipe"
                - $ref: "#/components/schemas/ServizioStampaOrdineCliente"
                - $ref: "#/components/schemas/ServizioStampaOrdineFornitore"
                - $ref: "#/components/schemas/ServizioStampaPreventivo"
                - $ref: "#/components/schemas/ServizioStampaOrdineMatrice"
                - $ref: "#/components/schemas/ServizioStampaMovimentoMagazzino"
                - $ref: "#/components/schemas/ServizioInsRigheOrdineCliente"
                - $ref: "#/components/schemas/ServizioInsRigheOrdineFornitore"
                - $ref: "#/components/schemas/ServizioInsRighePreventivo"
                - $ref: "#/components/schemas/ServizioInsRigheOrdineMatrice"
                - $ref: "#/components/schemas/ServizioInsRigheMovimentoMagazzino"
                - $ref: "#/components/schemas/ServizioListaDocdv"
                - $ref: "#/components/schemas/ServizioGetAllegatoArchivio"
                - $ref: "#/components/schemas/ServizioGetAssocDv"
                - $ref: "#/components/schemas/ServizioListaStruttureMydb"
                - $ref: "#/components/schemas/ServizioGetProprietaNumeratori"
                - $ref: "#/components/schemas/ServizioVerificaAutenticazioneMydb"
                - $ref: "#/components/schemas/ServizioGetCalendariProduzione"
                - $ref: "#/components/schemas/ServizioGetMultilotto"
                - $ref: "#/components/schemas/ServizioCambiaIbanTipoInvioDelega"
                - $ref: "#/components/schemas/ServizioInserisciAggiornaIban"
                - $ref: "#/components/schemas/ServizioGetStoricoOrdine"
              discriminator:
                propertyName: cmd
                mapping:
                  esec_collage_server_remoto: "#/components/schemas/ServizioEsecCollageServerRemoto"
                  sviluppo_distinta_base: "#/components/schemas/ServizioSviluppoDistintaBase"
                  avanzamento_produzione: "#/components/schemas/ServizioAvanzamentoProduzione"
                  spezzariga_bl: "#/components/schemas/ServizioSpezzarigaBl"
                  condizioni_documento: "#/components/schemas/ServizioCondizioniDocumento"
                  calcolo_esposizione: "#/components/schemas/ServizioCalcoloEsposizione"
                  get_prog_ubicazioni: "#/components/schemas/ServizioGetProgUbicazioni"
                  totali_documento: "#/components/schemas/ServizioTotaliDocumento"
                  totali_riga_documento: "#/components/schemas/ServizioTotaliRigaDocumento"
                  get_tabella_cap: "#/components/schemas/ServizioGetTabellaCap"
                  get_tabella_zone: "#/components/schemas/ServizioGetTabellaZone"
                  totali_nr_operazioni_contabili: "#/components/schemas/ServizioTotaliNrOperazioniContabili"
                  leggi_pratica_dr: "#/components/schemas/ServizioLeggiPraticaDr"
                  get_lista_pratiche_dr: "#/components/schemas/ServizioGetListaPraticheDr"
                  get_lista_deleghe: "#/components/schemas/ServizioGetListaDeleghe"
                  cambia_stato_delega: "#/components/schemas/ServizioCambiaStatoDelega"
                  get_registro_operazioni_utente: "#/components/schemas/ServizioGetRegistroOperazioniUtente"
                  leggi_dichiarazione_iva_annuale: "#/components/schemas/ServizioLeggiDichiarazioneIvaAnnuale"
                  leggi_comunicazioni_lipe: "#/components/schemas/ServizioLeggiComunicazioniLipe"
                  stampa_ordine_cliente: "#/components/schemas/ServizioStampaOrdineCliente"
                  stampa_ordine_fornitore: "#/components/schemas/ServizioStampaOrdineFornitore"
                  stampa_preventivo: "#/components/schemas/ServizioStampaPreventivo"
                  stampa_ordine_matrice: "#/components/schemas/ServizioStampaOrdineMatrice"
                  stampa_movimento_magazzino: "#/components/schemas/ServizioStampaMovimentoMagazzino"
                  ins_righe_ordine_cliente: "#/components/schemas/ServizioInsRigheOrdineCliente"
                  ins_righe_ordine_fornitore: "#/components/schemas/ServizioInsRigheOrdineFornitore"
                  ins_righe_preventivo: "#/components/schemas/ServizioInsRighePreventivo"
                  ins_righe_ordine_matrice: "#/components/schemas/ServizioInsRigheOrdineMatrice"
                  ins_righe_movimento_magazzino: "#/components/schemas/ServizioInsRigheMovimentoMagazzino"
                  lista_docdv: "#/components/schemas/ServizioListaDocdv"
                  get_allegato_archivio: "#/components/schemas/ServizioGetAllegatoArchivio"
                  get_assoc_dv: "#/components/schemas/ServizioGetAssocDv"
                  lista_strutture_mydb: "#/components/schemas/ServizioListaStruttureMydb"
                  get_proprieta_numeratori: "#/components/schemas/ServizioGetProprietaNumeratori"
                  verifica_autenticazione_mydb: "#/components/schemas/ServizioVerificaAutenticazioneMydb"
                  get_calendari_produzione: "#/components/schemas/ServizioGetCalendariProduzione"
                  get_multilotto: "#/components/schemas/ServizioGetMultilotto"
                  cambia_iban_tipo_invio_delega: "#/components/schemas/ServizioCambiaIbanTipoInvioDelega"
                  inserisci_aggiorna_iban: "#/components/schemas/ServizioInserisciAggiornaIban"
                  get_storico_ordine: "#/components/schemas/ServizioGetStoricoOrdine"
      responses:
        "200":
          description: Esito del servizio. JSON per la maggior parte dei servizi, PDF per le stampe.
          content:
            "application/json":
              schema:
                anyOf:
                  - $ref: "#/components/schemas/RispostaCondizioniDocumento"
                  - $ref: "#/components/schemas/RispostaCalcoloEsposizione"
                  - $ref: "#/components/schemas/RispostaGetProprietaNumeratori"
                  - type: object
                    description: Risposta di un servizio senza schema documentato.
            "application/pdf":
              schema:
                type: string
                contentMediaType: application/pdf
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
components:
  securitySchemes:
    passepartout:
      type: apiKey
      in: header
      name: Authorization
      description: "Formato `Passepartout <base64(utente:password)>`. Sul cloud: `Passepartout <base64> Dominio=<DOMINIO>`. Con login di sistema operativo attivo (login=1) si aggiunge un secondo blocco `<base64(utente_so:password_so)>`."
  parameters:
    CoordinateGestionale:
      name: Coordinate-Gestionale
      in: header
      required: true
      description: Azienda e anno di lavoro, più sotto-azienda e magazzino di default facoltativi (magazzino 1 se omesso).
      schema:
        type: string
        pattern: "^Azienda=\\S+( SottoAzienda=\\S+)? Anno=\\d{4}( Magazzino=\\d+)?$"
        examples:
          - "Azienda=DEM Anno=2026 Magazzino=1"
  responses:
    ErroreRichiesta:
      description: "Richiesta non valida: parametri o campi errati, errore gestionale (6001), coordinate mancanti."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonAutorizzato:
      description: "Credenziali assenti o errate. Attenzione: tentativi ripetuti bloccano l'utente WebAPI."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonTrovato:
      description: Risorsa inesistente o path non valido (nessun body).
    PoolEsaurito:
      description: "Pool di 5 servizi dell'utente WebAPI esaurito: riprovare più tardi, senza retry aggressivi."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    ServizioEsecCollageServerRemoto:
      type: object
      title: Collage Server Remoto
      description: |-
        Questo comando permette l’esecuzione di un Collage Server Remoto contenuto in una Passapp, esattamente come avviene con WebShaker (di fatto WebShaker è a tutti gli effetti una “costola” di WebAPI). È necessario specificare i dati necessari all’individuazione dell’etichetta Collage da eseguire all’interno della Passapp indicando codice_app, nome_collage e etichetta_collage.

        - Il risultato dell’elaborazione dipende dalla logica implementata nel Collage Server Remoto.
        - Il servizio replica il funzionamento di WebShaker per l’esecuzione di logiche custom lato server.
      required:
        - cmd
        - codice_app
        - nome_collage
        - etichetta_collage
      properties:
        cmd:
          type: string
          const: esec_collage_server_remoto
        codice_app:
          type: string
          description: Codice della Passapp contenente il Collage
        nome_collage:
          type: string
          description: Nome del file Collage all’interno della Passapp
        etichetta_collage:
          type: string
          description: Etichetta Collage da eseguire
        dati:
          type: object
          description: Parametri del servizio.
        next:
          type: string
          description: Token di paginazione ricevuto nella risposta precedente, accanto a cmd.
      x-mexal-endpoint: "/servizi"
    ServizioSviluppoDistintaBase:
      type: object
      title: Sviluppo Distinta Base
      description: |-
        Servizio per lo sviluppo della distinta base di un articolo. Nel caso di articolo non a taglie è necessario specificare la quantità come primo elemento dell’array quantita_taglie.

        - Per articoli non a taglie, specificare la quantità come primo elemento dell’array quantita_taglie (es. [[1, 5]]).
        - L’array quantita_taglie accetta coppie [indice, quantità] con indice da 1 a 32.
      required:
        - cmd
        - dati
      properties:
        cmd:
          type: string
          const: sviluppo_distinta_base
        dati:
          type: object
          description: Parametri del servizio.
          properties:
            codice_articolo:
              type: string
              description: Codice dell’articolo di cui sviluppare la distinta
            codice_art_padre:
              type: string
              description: Codice articolo padre
            codice_cliente:
              type: string
              description: Codice del cliente
            data_documento:
              type: string
              description: Data del documento
            codice:
              type: number
              description: Numero bolla
            cod_sottobolla:
              type: number
              description: Numero sottobolla
            nr_rif_pf:
              type: number
              description: Numero riferimento prodotto finito
            id_riga_oc:
              type: number
              description: Id riga ordine
            quantita_taglie:
              type: array
              description: "Array di coppie [indice_taglia, quantità] (da 1 a 32)"
          required:
            - codice_articolo
        next:
          type: string
          description: Token di paginazione ricevuto nella risposta precedente, accanto a cmd.
      x-mexal-endpoint: "/servizi"
    ServizioAvanzamentoProduzione:
      type: object
      title: Avanzamento di Produzione
      description: |-
        Servizio per avanzare la produzione creando automaticamente i relativi documenti di carico (CL) e scarico (SL).

        - Il campo tp_operazione accetta “S” per Scarico o “C” per Carico.
        - Il servizio crea automaticamente i documenti CL (carico) e SL (scarico) corrispondenti.
      required:
        - cmd
        - dati
      properties:
        cmd:
          type: string
          const: avanzamento_produzione
        dati:
          type: object
          description: Parametri del servizio.
          properties:
            data_documento:
              type: string
              description: Data documento nel formato AAAAMMGG
            codice:
              type: number
              description: Numero bolla
            cod_sottobolla:
              type: number
              description: Numero sottobolla
            nr_rif_pf:
              type: number
              description: Numero riferimento prodotto finito
            tp_operazione:
              type: string
              description: "Tipo operazione: “S” (Scarico) o “C” (Carico)"
            nr_fase:
              type: number
              description: Numero fase
            id_lotto:
              type: array
              description: Array id lotti
            qta_lotto:
              type: array
              description: Array quantità lotti
            qta_agg_carico:
              type: number
              description: Quantità aggiuntiva carico
            nr_colli_lotto:
              type: array
              description: Array numero colli lotto
            qta_tg_lotto:
              type: array
              description: Array quantità taglie lotto
            nr_decimali_qta:
              type: array
              description: Array numero decimali quantità
            id_lotto_sa:
              type: array
              description: Array id lotti semilavorati/accessori
            qta_lotto_sa:
              type: array
              description: Array quantità lotti semilavorati/accessori
            nr_colli_lo_sa:
              type: array
              description: Array numero colli lotti semilavorati/accessori
            qta_tg_lo_sa:
              type: array
              description: Array quantità taglie lotti semilavorati/accessori
            nr_dev_qta_sa:
              type: array
              description: Array numero deviazioni quantità semilavorati/accessori
            nr_righe_lo_sa:
              type: array
              description: Array numero righe lotti semilavorati/accessori
            nr_righe_lotto:
              type: number
              description: Numero righe lotto
          required:
            - data_documento
            - codice
            - cod_sottobolla
            - nr_rif_pf
            - tp_operazione
            - nr_fase
        next:
          type: string
          description: Token di paginazione ricevuto nella risposta precedente, accanto a cmd.
      x-mexal-endpoint: "/servizi"
    ServizioSpezzarigaBl:
      type: object
      title: Spezza Riga Bolle di Lavorazione
      description: |-
        Funzione che permette di spezzare la quantità di riga del prodotto finito, suddividendo in due righe le quantità totali. È utilizzata per effettuare gli avanzamenti di produzione parziali. Come per lo sviluppo della distinta base, nel caso di articolo non a taglie è necessario specificare la quantità come primo elemento dell’array qta.

        - Per articoli non a taglie, la quantità va specificata come primo elemento dell’array qta (es.
      required:
        - cmd
        - dati
      properties:
        cmd:
          type: string
          const: spezzariga_bl
        dati:
          type: object
          description: Parametri del servizio.
          properties:
            codice:
              type: number
              description: Numero bolla
            cod_sottobolla:
              type: number
              description: Numero sottobolla
            codice_pf:
              type: string
              description: Codice articolo prodotto finito
            nr_rif_pf:
              type: number
              description: Numero riferimento prodotto finito
            qta:
              type: array
              description: "Array di coppie [indice_taglia, quantità]"
            stato_riga_orig:
              type: string
              description: Stato della riga di origine
            stato_riga_dest:
              type: string
              description: Stato della riga di destinazione
            solo_bl:
              type: string
              description: "“S” o “N” — indica se operare solo sulla bolla di lavorazione"
          required:
            - codice
            - cod_sottobolla
            - codice_pf
            - nr_rif_pf
            - qta
            - stato_riga_orig
            - stato_riga_dest
        next:
          type: string
          description: Token di paginazione ricevuto nella risposta precedente, accanto a cmd.
      x-mexal-endpoint: "/servizi"
    ServizioCondizioniDocumento:
      type: object
      title: Condizioni Documento
      description: Servizio che permette di ottenere, se presenti, prezzo, sconto e provvigione in base ai parametri impostati.
      required:
        - cmd
        - dati
      properties:
        cmd:
          type: string
          const: condizioni_documento
        dati:
          type: object
          description: Parametri del servizio.
          properties:
            tipo:
              type: number
              description: "1: prezzo, sconto e provvigione; 2: sconto e provvigione; 3: solo provvigione"
            cod_conto:
              type: string
              description: Conto del cliente
            codice_articolo:
              type: string
              description: Codice articolo
            data_documento:
              type: string
              description: Data documento formato AAAAMMGG
            sigla_documento:
              type: string
              description: "Sigla documento (es. “OC”)"
            prezzo:
              type: number
              description: "Se impostato e tipo=1/2, viene utilizzato come base per calcolo sconti e provvigioni"
            quantita:
              type: number
              description: Valore per lo scaglione delle quantità
            coefficiente:
              type: number
              description: Se zero lavora in u.m. primaria dell’articolo, se valorizzato in u.m. secondaria
            valuta:
              type: number
              description: Codice valuta
            id_listino:
              type: number
              description: ID listino (se zero si usa il listino del cliente)
            sconto:
              type: string
              description: "Se impostato e tipo=3, viene utilizzato come base per calcolo provvigioni"
            id_cat_sconto:
              type: number
              description: Se impostata, viene utilizzata al posto di quella del cliente
            id_categoria_pr:
              type: number
              description: Se impostata, viene utilizzata al posto di quella del cliente
            extra:
              type: string
              description: Se impostato, viene utilizzato per il calcolo
            cod_agente:
              type: string
              description: Se impostato, viene utilizzato questo agente per il calcolo
          required:
            - tipo
            - cod_conto
            - codice_articolo
            - data_documento
            - sigla_documento
        next:
          type: string
          description: Token di paginazione ricevuto nella risposta precedente, accanto a cmd.
      x-mexal-endpoint: "/servizi"
    RispostaCondizioniDocumento:
      type: object
      title: Risposta condizioni_documento
      properties:
        prezzo:
          type: number
          description: Prezzo calcolato
        sconto:
          type: string
          description: Sconto calcolato
        provvigione:
          type: number
          description: Provvigione calcolata
        tp_provvigione:
          type: array
          description: "Tipo provvigione (% o T=totale)"
        formula_pr:
          type: array
          description: Formula provvigione
        codice_agente:
          type: array
          description: Codici agente
        quota_pr:
          type: array
          description: Quota provvigione ripartita
        cond_agente:
          type: array
          description: Condizione agente
        modalita_pr:
          type: array
          description: Modalità provvigione
        base_impon_calc:
          type: array
          description: Base imponibile di calcolo provvigione
        utente_ult_mod:
          type: string
          description: Utente ultima modifica
        data_ult_mod:
          type: string
          description: Data ultima modifica
    ServizioCalcoloEsposizione:
      type: object
      title: Calcolo Esposizione
      description: Servizio che permette, dato un codice conto e una data di riferimento, di calcolare i dati relativi all’esposizione di un cliente/fornitore.
      required:
        - cmd
        - dati
      properties:
        cmd:
          type: string
          const: calcolo_esposizione
        dati:
          type: object
          description: Parametri del servizio.
          properties:
            in_codice_conto:
              type: string
              description: Codice conto del cliente/fornitore
