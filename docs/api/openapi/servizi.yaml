    ServizioVerificaAutenticazioneMydb:
      type: object
      title: Autenticazione MyDB
      description: |-
        Per i soli campi degli archivi MyDB etichettati come “Aut” è possibile gestire l’autenticazione tramite questo servizio. Il servizio funziona esclusivamente per coppie di credenziali utente+password, quindi se un archivio MyDB contiene più di 2 campi etichettati come “Aut” nel servizio è necessario specificare quali sono i campi sui quali si vuole verificare l’autenticazione.

        - È possibile specificare il record specifico su cui fare il controllo tramite in_id: se viene omesso, il controllo viene fatto su tutti i record e restituisce esito positivo alla prima coppia di credenziali verificata.
        - Il servizio funziona esclusivamente per coppie di credenziali (login + password).
      required:
        - cmd
        - dati
      properties:
        cmd:
          type: string
          const: verifica_autenticazione_mydb
        dati:
          type: object
          description: Parametri del servizio.
          properties:
            in_codice_archivio:
              type: string
              description: Archivio MyDB contenente i campi di autenticazione
            in_nomecampo_login:
              type: string
              description: "Campo dell’archivio MyDB designato come campo “username”"
            in_login_value:
              type: string
              description: Username necessario per l’autenticazione
            in_nomecampo_password:
              type: string
              description: "Campo dell’archivio MyDB designato come campo “password”"
