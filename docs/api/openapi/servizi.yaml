            id:
              type: number
              description: ID del particolare documento (può essere 0 o omesso se codice è valorizzato)
        next:
          type: string
          description: Token di paginazione ricevuto nella risposta precedente, accanto a cmd.
      x-mexal-endpoint: "/servizi"
    ServizioListaStruttureMydb:
      type: object
      title: Lista Strutture MyDB
      description: |-
        Tramite questo servizio è possibile leggere e filtrare tutta la lista delle strutture MyDB presenti sui vari archivi.

        - Nell’elemento campi possono essere indicati gli unici campi che si vogliono ottenere in risposta.
        - Nell’elemento filtri possono essere specificati dei filtri con le stesse condizioni usate per gli end-point REST.
        - Se info_campi=true viene mostrato l’help in linea di tutti i campi che compongono la struttura.
      required:
        - cmd
      properties:
        cmd:
          type: string
          const: lista_strutture_mydb
        info_campi:
          type: boolean
          description: Se true, viene mostrato l’help in linea di tutti i campi che compongono la struttura
        campi:
          type: array
          description: Elenco dei soli campi da restituire nella response
        filtri:
          type: array
          description: "Array di oggetti filtro con le stesse condizioni usate per gli end- point REST Sintassi per campi e filtri Per indicare i campi negli elementi campi o filtri bisogna specificare il percorso completo del campo di interesse all’interno della struttura JSON usando i : come separatore. Ad esempio, per usare il campo codice_campo all’interno della collection elenco_campi: lista_strutture_mydb:elenco_campi:codice_campo"
        dati:
          type: object
          description: Parametri del servizio.
        next:
          type: string
          description: Token di paginazione ricevuto nella risposta precedente, accanto a cmd.
      x-mexal-endpoint: "/servizi"
