    ServizioListaDocdv:
      type: object
      title: Lista Allegati Docuvision
      description: |-
        Servizio che permette di ottenere la lista di tutti gli allegati Docuvision. È possibile filtrare i risultati tramite l’elemento filtri e selezionare i soli campi che si vogliono leggere tramite l’elemento campi (come avviene per gli end-point REST).

        - Il parametro numerico in_classe deve essere sempre indicato.
        - Il parametro in_allegati è opzionale (default “T”):
      required:
        - cmd
        - dati
      properties:
        cmd:
          type: string
          const: lista_docdv
        dati:
          type: object
          description: "Parametri del servizio. Struttura degli elementi annidati: campi (array): Elenco dei soli campi da restituire; filtri (array): Array di oggetti filtro (campo, condizione, valore) Tabella Classi Docuvision classe_dv Descrizione 1 Stampa generica 100 Anagrafica nominativi 200 Bilanci 400 Anagrafica Cliente/Fornitore 600 Operazione contabile 800 Dichiarativi/Versamenti 900 Stampe Fiscali 1000 Agenda di lavoro 1100 Parcella/Notula 1200 Anagrafica articolo 1400 Movimento di magazzino 1450 Controllo di gestione 1500 Ordine/Preventivo/Matrice 1600 Bolla di lavorazione 1700 Anagrafiche MyDB Parametri di filtro per classe Oltre ai filtri sui campi dell’archivio è possibile specificare nell’oggetto dati anche ulteriori parametri di filtro. I parametri di filtro sono gli stessi che, da gestionale in Docuvision → Gestione documento, compaiono nella maschera “Parametri su classe” (F2, scelta della classe e poi F7). Classe 1 — Stampa generica Tipo Nome Variabile STR in_stpg_menu STR in_stpg_op_menu STR in_stpg_nota STR in_stpg_op_nota Classe 100 — Anagrafica nominativi Tipo Nome Variabile STR in_nomi_tp_allega DAT in_nomi_dt_da DAT in_nomi_dt_a Classe 200 — Bilanci Tipo Nome Variabile NUM in_bila_anno STR in_bila_tipo STR in_bila_autore STR in_bila_op_autore Classe 400 — Anagrafica Cliente/Fornitore Tipo Nome Variabile STR in_pico_tp_conto STR in_pico_cod_conto STR in_pico_cod_alt STR in_pico_op_cod_alt STR in_pico_nome_ric STR in_pico_op_nome_ric STR in_pico_prv NUM in_pico_zona NUM in_pico_catsta Classe 600 — Operazione contabile Tipo Nome Variabile NUM in_prn_sotto_az DAT in_prn_dt_regis STR in_prn_cau STR in_prn_desc_testa STR in_prn_op_desc_testa STR in_prn_tp_rstro NUM in_prn_serie_prot NUM in_prn_nr_prot NUM in_prn_nr_doc DAT in_prn_dt_doc STR in_prn_tp_invio Classe 800 — Dichiarativi/Versamenti Tipo Nome Variabile NUM in_dicv_anno STR in_dicv_dich STR in_dicv_tp_doc STR in_dicv_sgl_prat STR in_dicv_interno STR in_dicv_dich_coniuge STR in_dicv_tp_allega Classe 900 — Stampe Fiscali Tipo Nome Variabile NUM in_stpf_anno STR in_stpf_doc STR in_stpf_tp_doc STR in_stpf_op_tp_doc STR in_stpf_crit_sel STR in_stpf_op_crit_sel Classe 1000 — Agenda di lavoro Tipo Nome Variabile STR in_agen_stato DAT in_agen_dt_lavoro STR in_agen_cod_conto STR in_agen_prest STR in_agen_op_prest Classe 1100 — Parcella/Notula Tipo Nome Variabile NUM in_notp_sotto_az STR in_notp_tp_doc NUM in_notp_serie NUM in_notp_numero DAT in_notp_dt_doc STR in_notp_cod_conto STR in_notp_note STR in_notp_op_note Classe 1200 — Anagrafica articolo Tipo Nome Variabile STR in_arti_cod STR in_arti_op_cod STR in_arti_desc STR in_arti_op_desc STR in_arti_cod_alt STR in_arti_op_cod_alt STR in_arti_catsta STR in_arti_tp_allega Classe 1400 — Movimento di magazzino Tipo Nome Variabile NUM in_mm_sotto_az STR in_mm_sigla NUM in_mm_serie NUM in_mm_numero DAT in_mm_dt_doc NUM in_mm_anno_solare STR in_mm_cod_conto NUM in_mm_zona NUM in_mm_catsta STR in_mm_note STR in_mm_op_note Classe 1450 — Controllo di gestione Tipo Nome Variabile STR in_cdg_tp_anag Analitici: Tipo Nome Variabile STR in_cdg_a_cod STR in_cdg_a_tp STR in_cdg_a_natura STR in_cdg_a_qualita Commesse: Tipo Nome Variabile STR in_cdg_c_cod STR in_cdg_c_padre STR in_cdg_c_tp STR in_cdg_c_respons STR in_cdg_c_zona NUM in_cdg_c_cli NUM in_cdg_c_dest_merce NUM in_cdg_c_age Aree: Tipo Nome Variabile STR in_cdg_r_cod STR in_cdg_r_padre STR in_cdg_r_tp STR in_cdg_r_respons STR in_cdg_r_zona Classe 1500 — Ordine/Preventivo/Matrice Tipo Nome Variabile NUM in_ordi_sotto_az STR in_ordi_sigla NUM in_ordi_serie NUM in_ordi_numero DAT in_ordi_dt_doc STR in_ordi_cod_conto STR in_ordi_note STR in_ordi_op_note Classe 1600 — Bolla di lavorazione Tipo Nome Variabile NUM in_blav_cod STR in_blav_cod_sottobl DAT in_blav_dt_bolla STR in_blav_cod_conto STR in_blav_nota STR in_blav_op_nota."
          properties:
            in_classe:
              type: number
              description: Classe del documento (vedi tabella classi)
            in_allegati:
              type: string
              description: "“S” = solo allegati, “N” = solo non allegati, “T” = tutti (default)"
            in_gest_dv_dr:
              type: string
              description: "“S” = usa il DB dei redditi, “N” = DB aziendale"
          required:
            - in_classe
        next:
          type: string
          description: Token di paginazione ricevuto nella risposta precedente, accanto a cmd.
      x-mexal-endpoint: "/servizi"
    ServizioGetAllegatoArchivio:
      type: object
      title: Lettura Allegati Docuvision
      description: |-
        Tramite questo servizio è possibile, per ogni archivio del gestionale, leggere i documenti allegati. Gli allegati vengono restituiti in un multipart/form-data in formato RAW ognuno evidenziato con il proprio Content-Type (es. application/pdf, image/jpg, etc.) come da RFC 1341.

        - La response è di tipo multipart/form-data con ogni allegato evidenziato con il proprio
      required:
        - cmd
        - dati
      properties:
        cmd:
          type: string
          const: get_allegato_archivio
        dati:
          type: object
          description: "Parametri del servizio. Struttura degli elementi annidati: next (string): Token di paginazione Mutua esclusività dei parametri • I campi codice e id_dv sono mutuamente esclusivi. • Nel caso numero_versione_dv > 0 è obbligatorio specificare anche id_dv. Tabella Classi Docuvision classe_dv Descrizione 1 Stampa generica 100 Anagrafica nominativi 200 Bilanci 400 Anagrafica Cliente/Fornitore 600 Operazione contabile 800 Dichiarativi/Versamenti 900 Stampe Fiscali 1000 Agenda di lavoro 1100 Parcella/Notula 1200 Anagrafica articolo 1400 Movimento di magazzino 1450 Controllo di gestione 1500 Ordine/Preventivo/Matrice 1600 Bolla di lavorazione 1700 Anagrafiche MyDB."
          properties:
            tipo:
              type: string
              description: "Tipo di allegato richiesto (al momento solo “docuvision”)"
            codice:
              type: string
              description: "Codice dell’entità di cui si vogliono leggere gli allegati (non valorizzare se id_dv > 0)"
            classe_dv:
              type: number
              description: Classe del documento Docuvision
            id_dv:
              type: number
              description: ID del particolare documento (0 o omesso se codice è valorizzato)
            numero_versione_dv:
              type: number
              description: "Versione del documento: -1 = tutte, 0 = ultima, >0 = specifica"
          required:
            - tipo
            - classe_dv
        next:
          type: string
          description: Token di paginazione ricevuto nella risposta precedente, accanto a cmd.
      x-mexal-endpoint: "/servizi"
    ServizioGetAssocDv:
      type: object
      title: Associazioni Docuvision
      description: |-
        Tramite questo servizio è possibile leggere le associazioni fra il documento Docuvision e le entità del gestionale in cui è stato allegato.

        - I campi codice/classe e id possono essere usati in combinazione per restringere la ricerca.
