openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Lotti
  version: "88201"
  description: |-
    Generato da `tools/api-docs/genera.php` a partire dall'help in linea (`GET /risorse/help?extended=true`)
    e da `?info=true` di un'installazione Mexal/Passcom 2.9.17 (versione gestionale 88201), integrato con il manuale WebAPI v3.1.
    Endpoint e campi dipendono da versione e moduli installati: la fonte di verità resta `?info=true`.

    **Convenzioni**

    - Autenticazione: `Authorization: Passepartout <base64(utente:password)>`; sul cloud si aggiunge ` Dominio=<DOMINIO>`.
    - Contesto aziendale: header `Coordinate-Gestionale: Azienda=XXX Anno=AAAA` (opzionali `SottoAzienda=`, `Magazzino=`).
    - Date `AAAAMMGG`, date-ora `AAAAMMGG HHMMSS`, decimali con il punto.
    - Gli array sono liste di coppie `[[indice, valore], ...]`, non liste semplici.
    - Chiavi composte unite da `+` nel path (es. `OC+1+15`). Codici con `/` o `\` vanno in esadecimale con `?encoding=hex`.
    - Paginazione: `max` limita i record, il token `next` della risposta va ripassato così com'è e subito.
    - Ricerca: `POST .../ricerca` con `filtri`; i filtri sono in AND, i valori di uno stesso filtro in OR.
    - Revisione (PUT): rimandare `data_ult_mod` letto dalla GET per il controllo di modifica concorrente.
    - Limiti: 5 richieste simultanee per utente WebAPI (oltre si riceve 503).
servers:
  - url: "https://{host}:{porta}/webapi/risorse"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi/risorse"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
tags:
  - name: lotti
    description: "Lotti e matricole di magazzino, con stato, scadenza e campi personalizzati del tipo lotto. Campi ricavati dal manuale WebAPI v3.1: l'installazione interrogata non li espone con ?info=true (6001 - errore gestionale [Lotti non gestiti])."
paths:
  "/lotti":
    get:
      tags:
        - lotti
      operationId: lotti_lista
      summary: Lista lotti
      description: |-
        Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento.

        Supporta paginazione tramite max e next (vedi Paginazione)

        Supporta selezione campi tramite fields (vedi Formato Request)

        Il campo data_ric_elab nella response indica la data/ora di elaborazione della richiesta
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LottiCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/LottiLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "82001"
    post:
      tags:
        - lotti
      operationId: lotti_crea
      summary: Inserimento lotto
      description: |-
        Risponde 201 senza body: il codice assegnato è nell'header `Location`.

        Richiede header Coordinate-Gestionale con Azienda e Anno

        Il tipo lotto deve essere precedentemente definito nei dati generali (vedi Dati Generali)
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LottiInserimento"
      responses:
        "201":
          description: "Creato. Nessun body: il path della nuova risorsa è nell'header Location."
          headers:
            Location:
              description: "Path della risorsa creata (es. /webapi/risorse/lotti/...). Può contenere ?encoding=hex."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "82001"
  "/lotti/ricerca":
    post:
      tags:
        - lotti
      operationId: lotti_cerca
      summary: Ricerca lotti
      description: |-
        Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`.

        Campi filtrabili: tutti i campi della risorsa (es. cod_articolo, cod_tipo_lotto, stato, cod_fornitore)
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LottiCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LottiRicerca"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/LottiLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "82001"
  "/lotti/{id}":
    get:
      tags:
        - lotti
      operationId: lotti_leggi
      summary: Lettura lotto
      description: |-
        Chiave numerica semplice (ID intero)

        La lettura singola restituisce anche i campi personalizzati (num_campi_pers, cod_campi_pers, tp_campi_pers, val_campi_pers) non presenti nella lista

        I tipi campi personalizzati sono: I = intero, A = alfanumerico
      parameters:
        - name: id
          in: path
          required: true
          description: "Parte di chiave `id`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LottiCampo"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Lotti"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "82001"
    put:
      tags:
        - lotti
      operationId: lotti_modifica
      summary: Modifica lotto
      description: |-
        Inviare solo i campi da modificare, più `data_ult_mod` letto dalla GET se il controllo di modifica concorrente è attivo.

        Il campo id è obbligatorio nel body (deve corrispondere all’ID nel path)

        I campi di sola lettura (data_creazione, data_modifica, utente_ult_mod, data_ult_mod) vengono aggiornati automaticamente dal sistema
      parameters:
        - name: id
          in: path
          required: true
          description: "Parte di chiave `id`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LottiModifica"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "82001"
    delete:
      tags:
        - lotti
      operationId: lotti_elimina
      summary: Cancellazione lotto
      description: Non è possibile eliminare un lotto referenziato da movimenti di magazzino esistenti
      parameters:
        - name: id
          in: path
          required: true
          description: "Parte di chiave `id`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "82001"
components:
  securitySchemes:
    passepartout:
      type: apiKey
      in: header
      name: Authorization
      description: "Formato `Passepartout <base64(utente:password)>`. Sul cloud: `Passepartout <base64> Dominio=<DOMINIO>`. Con login di sistema operativo attivo (login=1) si aggiunge un secondo blocco `<base64(utente_so:password_so)>`."
  parameters:
    CoordinateGestionale:
      name: Coordinate-Gestionale
      in: header
      required: true
      description: Azienda e anno di lavoro, più sotto-azienda e magazzino di default facoltativi (magazzino 1 se omesso).
      schema:
        type: string
        pattern: "^Azienda=\\S+( SottoAzienda=\\S+)? Anno=\\d{4}( Magazzino=\\d+)?$"
        examples:
          - "Azienda=DEM Anno=2026 Magazzino=1"
    Max:
      name: max
      in: query
      description: Numero massimo di record per pagina. Il server può restituirne meno (limiti di 30 s e 50 MB).
      schema:
        type: integer
        minimum: 1
    Next:
      name: next
      in: query
      description: "Token di pagina restituito dalla risposta precedente: opaco, da usare subito e così com'è."
      schema:
        type: string
    Encoding:
      name: encoding
      in: query
      description: "Codifica delle parti di chiave nel path. Obbligatoria quando un codice contiene `/` o `\\`: il codice va inviato in esadecimale (es. `ARTI/S` -> `415254492f53`)."
      schema:
        type: string
        enum:
          - hex
          - base32
  responses:
    ErroreRichiesta:
      description: "Richiesta non valida: parametri o campi errati, errore gestionale (6001), coordinate mancanti."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonAutorizzato:
      description: "Credenziali assenti o errate. Attenzione: tentativi ripetuti bloccano l'utente WebAPI."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonTrovato:
      description: Risorsa inesistente o path non valido (nessun body).
    PoolEsaurito:
      description: "Pool di 5 servizi dell'utente WebAPI esaurito: riprovare più tardi, senza retry aggressivi."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    Lotti:
      type: object
      properties:
        id:
          type: integer
          description: "Identificatore lotto Chiave, obbligatorio in PUT — Identificatore numerico del lotto."
          x-mexal-tipo: Numerico
        stato:
          type: string
          description: "Stato del lotto Valori: C = corrente, B = bloccato, A = annullato — Stato lotto (C, B, A)."
          x-mexal-tipo: Alfanumerico
        msg_bloc_ann:
          type: string
          description: "Messaggio stato bloccato/annullato — Messaggio blocco/annullamento."
          x-mexal-tipo: Alfanumerico
        caricato:
          type: string
          description: "Carico effettuato da movimento magazzino Valori: S/N."
          x-mexal-tipo: Alfanumerico
        tp_ctrl_carico:
          type: string
          description: Tipo controllo carico lotto.
          x-mexal-tipo: Alfanumerico
        cod_articolo:
          type: string
          description: Codice articolo associato al lotto. Valori da articoli.codice.
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa: articoli
            campo: codice
        cod_tipo_lotto:
          type: string
          description: Codice tipo lotto/matricola Riferimento a tipi lotti (vedi Dati Generali). Valori da dati-generali/tipi-lotti-matricole.tipo_lotto.
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa: dati-generali/tipi-lotti-matricole
            campo: tipo_lotto
        cod_fornitore:
          type: string
          description: Codice fornitore. Valori da fornitori.codice.
          x-mexal-tipo: Alfanumerico
          x-mexal-riferimento:
            risorsa: fornitori
            campo: codice
        data_carico:
          type: string
          description: "Data di carico Formato AAAAMMGG — Data di carico (AAAAMMGG)."
          x-mexal-tipo: Alfanumerico
        data_validita:
          type: string
          description: "Data di validità/scadenza Formato AAAAMMGG — Data validità/scadenza (AAAAMMGG)."
          x-mexal-tipo: Alfanumerico
        data_creazione:
          type: string
          description: Data creazione Solo lettura. Data in formato AAAAMMGG.
          readOnly: true
          x-mexal-tipo: Alfanumerico
        data_modifica:
          type: string
          description: Data ultima modifica Solo lettura. Data in formato AAAAMMGG.
          readOnly: true
          x-mexal-tipo: Alfanumerico
        cod_ute_lotto:
          type: string
          description: Codice utente lotto (numero lotto assegnato).
          x-mexal-tipo: Alfanumerico
        num_campi_pers:
          type: integer
          description: Numero campi personalizzati Visibile in lettura singola.
          x-mexal-tipo: Numerico
        cod_campi_pers:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 1
              - type: string
            minItems: 2
            maxItems: 2
          description: "Codici dei campi personalizzati Array di coppie [indice, codice]. Array indicizzato [[indice, valore], ...]."
          x-mexal-tipo: Alfanumerico
        tp_campi_pers:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 1
              - type: string
            minItems: 2
            maxItems: 2
          description: "Tipi dei campi personalizzati Array di coppie [indice, tipo]. Array indicizzato [[indice, valore], ...]."
          x-mexal-tipo: Alfanumerico
        val_campi_pers:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 1
              - type: string
            minItems: 2
            maxItems: 2
          description: "Valori dei campi personalizzati Array di coppie [indice, valore] — Valori campi personalizzati. Array indicizzato [[indice, valore], ...]."
          x-mexal-tipo: Alfanumerico
        gest_stor_lotto:
          type: string
          description: "Gestione storicizzazione lotto Valori: S/N — Gestione storicizzazione (S/N)."
          x-mexal-tipo: Alfanumerico
        utente_ult_mod:
          type: string
          description: Utente ultima modifica Solo lettura.
          readOnly: true
          x-mexal-tipo: Alfanumerico
        data_ult_mod:
          type: string
          pattern: "^(\\d{8} \\d{6})?$"
          description: Data/ora ultima modifica Formato AAAAMMGG HHMMSS, solo lettura.
          readOnly: true
          x-mexal-tipo: Data e ora
      x-mexal-origine-campi: manuale
    LottiCampo:
      type: string
      enum:
        - id
        - stato
        - msg_bloc_ann
        - caricato
        - tp_ctrl_carico
        - cod_articolo
        - cod_tipo_lotto
        - cod_fornitore
        - data_carico
        - data_validita
        - data_creazione
        - data_modifica
        - cod_ute_lotto
        - num_campi_pers
        - cod_campi_pers
        - tp_campi_pers
        - val_campi_pers
        - gest_stor_lotto
        - utente_ult_mod
        - data_ult_mod
      description: Campi di lotti.
    LottiLista:
      type: object
      required:
        - dati
      properties:
        dati:
          type: array
          items:
            $ref: "#/components/schemas/Lotti"
        data_ric_elab:
          type: string
          description: Timestamp di elaborazione, AAAAMMGG HHMMSS.
        next:
          type: string
          description: "Presente solo se ci sono altre pagine: da passare così com'è nel parametro next."
    LottiRicerca:
      type: object
      required:
        - filtri
      properties:
        filtri:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/Filtro"
              - properties:
                  campo:
                    $ref: "#/components/schemas/LottiCampo"
    LottiInserimento:
      allOf:
        - $ref: "#/components/schemas/Lotti"
      required:
        - cod_articolo
        - cod_tipo_lotto
      description: "Body di inserimento. Obbligatori secondo il manuale: cod_articolo, cod_tipo_lotto."
    LottiModifica:
      allOf:
        - $ref: "#/components/schemas/Lotti"
      description: "Body di revisione: solo i campi da modificare."
      x-mexal-obbligatori-put: []
    Filtro:
      type: object
      required:
        - campo
        - condizione
        - valore
      properties:
        campo:
          type: string
          description: Nome del campo su cui filtrare.
        indice1:
          type: integer
          minimum: 1
          description: Indice del primo livello, per i campi array.
        indice2:
          type: integer
          minimum: 1
          description: Indice del secondo livello, per gli array a due livelli.
        condizione:
          type: string
          enum:
            - "="
            - "<>"
            - ">"
            - "<"
            - ">="
            - "<="
            - contiene
            - inizia_per
        case_insensitive:
          type: boolean
          default: false
          description: Solo per i confronti fra stringhe.
        valore:
          description: "Valore da confrontare; un array mette i valori in OR. Date come AAAAMMGG."
          anyOf:
            - type: string
            - type: number
            - type: array
              minItems: 1
              items:
                type:
                  - string
                  - number
    Errore:
      type: object
      properties:
        error:
          type: object
          properties:
            response-code:
              type: integer
            response-detail:
              type: string
              description: "Codice numerico + messaggio: \"<codice> - <messaggio> [<dettaglio>]\". 6001 = errore gestionale."
            response-message:
              type: string
            request-uri:
              type: string
            request-method:
              type: string
            request-id:
              type: string
              description: UUID da citare al supporto.
            warsion:
              type: string
            remote:
              type: string
            timestamp:
              type: string
