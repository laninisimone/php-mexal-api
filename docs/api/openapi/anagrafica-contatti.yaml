openapi: "3.1.0"
info:
  title: Passepartout WebAPI - Anagrafica contatti
  version: "88201"
  description: |-
    Generato da `tools/api-docs/genera.php` a partire dall'help in linea (`GET /risorse/help?extended=true`)
    e da `?info=true` di un'installazione Mexal/Passcom 2.9.17 (versione gestionale 88201), integrato con il manuale WebAPI v3.1.
    Endpoint e campi dipendono da versione e moduli installati: la fonte di verità resta `?info=true`.

    **Convenzioni**

    - Autenticazione: `Authorization: Passepartout <base64(utente:password)>`; sul cloud si aggiunge ` Dominio=<DOMINIO>`.
    - Contesto aziendale: header `Coordinate-Gestionale: Azienda=XXX Anno=AAAA` (opzionali `SottoAzienda=`, `Magazzino=`).
    - Date `AAAAMMGG`, date-ora `AAAAMMGG HHMMSS`, decimali con il punto.
    - Gli array sono liste di coppie `[[indice, valore], ...]`, non liste semplici.
    - Chiavi composte unite da `+` nel path (es. `OC+1+15`). Codici con `/` o `\` vanno in esadecimale con `?encoding=hex`.
    - Paginazione: `max` limita i record, il token `next` della risposta va ripassato così com'è e subito.
    - Ricerca: `POST .../ricerca` con `filtri`; i filtri sono in AND, i valori di uno stesso filtro in OR.
    - Revisione (PUT): rimandare `data_ult_mod` letto dalla GET per il controllo di modifica concorrente.
    - Limiti: 5 richieste simultanee per utente WebAPI (oltre si riceve 503).
servers:
  - url: "https://{host}:{porta}/webapi/risorse"
    description: Installazione locale (certificato spesso self-signed)
    variables:
      host:
        default: localhost
      porta:
        default: "9004"
  - url: "https://services.passepartout.cloud/webapi/risorse"
    description: "Passepartout Live (cloud): aggiungere Dominio=<DOMINIO> all'header Authorization"
security:
  - passepartout: []
tags:
  - name: anagrafica-contatti
    description: Anagrafica contatti (prospect e nominativi non ancora clienti) con condizioni commerciali.
paths:
  "/anagrafica-contatti":
    get:
      tags:
        - anagrafica-contatti
      operationId: anagrafica_contatti_lista
      summary: Lista anagrafica contatti
      description: |-
        Paginata: il server pagina oltre 30 secondi o 50 MB anche senza `max`; seguire `next` fino a esaurimento.

        Supporta paginazione e selezione campi
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AnagraficaContattiCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AnagraficaContattiLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "87100"
    post:
      tags:
        - anagrafica-contatti
      operationId: anagrafica_contatti_crea
      summary: Inserimento anagrafica contatti
      description: |-
        Risponde 201 senza body: il codice assegnato è nell'header `Location`.

        L’header Location nella response contiene l’URL della risorsa creata
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AnagraficaContattiInserimento"
      responses:
        "201":
          description: "Creato. Nessun body: il path della nuova risorsa è nell'header Location."
          headers:
            Location:
              description: "Path della risorsa creata (es. /webapi/risorse/anagrafica-contatti/...). Può contenere ?encoding=hex."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "87100"
  "/anagrafica-contatti/ricerca":
    post:
      tags:
        - anagrafica-contatti
      operationId: anagrafica_contatti_cerca
      summary: Ricerca anagrafica contatti
      description: |-
        Filtri in AND fra loro; un `valore` array mette i valori in OR. Condizioni: `=`, `<>`, `>`, `<`, `>=`, `<=`, `contiene`, `inizia_per`.

        Formato filtri standard WebAPI
      parameters:
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AnagraficaContattiCampo"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Next"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AnagraficaContattiRicerca"
      responses:
        "200":
          description: Record trovati
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AnagraficaContattiLista"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "87100"
  "/anagrafica-contatti/{codice}":
    get:
      tags:
        - anagrafica-contatti
      operationId: anagrafica_contatti_leggi
      summary: Lettura anagrafica contatti
      description: Chiave alfanumerica semplice
      parameters:
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
        - name: fields
          in: query
          description: "Campi da restituire, separati da virgola. Riduce il payload: usarlo sempre sulle liste."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AnagraficaContattiCampo"
      responses:
        "200":
          description: Record richiesto
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AnagraficaContatti"
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "87100"
    put:
      tags:
        - anagrafica-contatti
      operationId: anagrafica_contatti_modifica
      summary: Modifica anagrafica contatti
      description: |-
        Inviare solo i campi da modificare, più `data_ult_mod` letto dalla GET se il controllo di modifica concorrente è attivo.

        Inviare nel body solo i campi da modificare
      parameters:
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AnagraficaContattiModifica"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "87100"
    delete:
      tags:
        - anagrafica-contatti
      operationId: anagrafica_contatti_elimina
      summary: Cancellazione anagrafica contatti
      description: Operazione irreversibile
      parameters:
        - name: codice
          in: path
          required: true
          description: "Parte di chiave `codice`."
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/CoordinateGestionale"
      responses:
        "204":
          description: Operazione eseguita, nessun body.
        "400":
          $ref: "#/components/responses/ErroreRichiesta"
        "401":
          $ref: "#/components/responses/NonAutorizzato"
        "404":
          $ref: "#/components/responses/NonTrovato"
        "503":
          $ref: "#/components/responses/PoolEsaurito"
      x-mexal-versione-minima: "87100"
components:
  securitySchemes:
    passepartout:
      type: apiKey
      in: header
      name: Authorization
      description: "Formato `Passepartout <base64(utente:password)>`. Sul cloud: `Passepartout <base64> Dominio=<DOMINIO>`. Con login di sistema operativo attivo (login=1) si aggiunge un secondo blocco `<base64(utente_so:password_so)>`."
  parameters:
    CoordinateGestionale:
      name: Coordinate-Gestionale
      in: header
      required: true
      description: Azienda e anno di lavoro, più sotto-azienda e magazzino di default facoltativi (magazzino 1 se omesso).
      schema:
        type: string
        pattern: "^Azienda=\\S+( SottoAzienda=\\S+)? Anno=\\d{4}( Magazzino=\\d+)?$"
        examples:
          - "Azienda=DEM Anno=2026 Magazzino=1"
    Max:
      name: max
      in: query
      description: Numero massimo di record per pagina. Il server può restituirne meno (limiti di 30 s e 50 MB).
      schema:
        type: integer
        minimum: 1
    Next:
      name: next
      in: query
      description: "Token di pagina restituito dalla risposta precedente: opaco, da usare subito e così com'è."
      schema:
        type: string
    Encoding:
      name: encoding
      in: query
      description: "Codifica delle parti di chiave nel path. Obbligatoria quando un codice contiene `/` o `\\`: il codice va inviato in esadecimale (es. `ARTI/S` -> `415254492f53`)."
      schema:
        type: string
        enum:
          - hex
          - base32
  responses:
    ErroreRichiesta:
      description: "Richiesta non valida: parametri o campi errati, errore gestionale (6001), coordinate mancanti."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonAutorizzato:
      description: "Credenziali assenti o errate. Attenzione: tentativi ripetuti bloccano l'utente WebAPI."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
    NonTrovato:
      description: Risorsa inesistente o path non valido (nessun body).
    PoolEsaurito:
      description: "Pool di 5 servizi dell'utente WebAPI esaurito: riprovare più tardi, senza retry aggressivi."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    AnagraficaContatti:
      type: object
      properties:
        codice:
          type: string
          description: Codice contatto. Campo chiave.
          x-mexal-tipo: Alfanumerico
        url:
          type: string
          description: Indirizzo internet.
          x-mexal-tipo: Alfanumerico
        descrizione:
          type: string
          description: Descrizione (ragione sociale).
          x-mexal-tipo: Alfanumerico
        note:
          type: string
          description: Note.
          x-mexal-tipo: Alfanumerico
        indirizzo:
          type: string
          description: Indirizzo.
          x-mexal-tipo: Alfanumerico
        data_validita:
          type: string
          description: Data validita'. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        cap:
          type: string
          description: "C.A.P. — CAP."
          x-mexal-tipo: Alfanumerico
        data_creazione:
          type: string
          description: Data creazione. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        localita:
          type: string
          description: "Localita' — Località."
          x-mexal-tipo: Alfanumerico
        dt_anagrafica:
          type: string
          description: Data aggiornamento anagrafica. Data in formato AAAAMMGG.
          x-mexal-tipo: Alfanumerico
        provincia:
          type: string
          description: Provincia (sigla 2 caratteri).
          x-mexal-tipo: Alfanumerico
        partita_iva:
          type: string
          description: Partita iva.
          x-mexal-tipo: Alfanumerico
        nazionalita:
          type: string
          description: Nazionalita'.
          x-mexal-tipo: Alfanumerico
        codice_fiscale:
          type: string
          description: Codice fiscale.
          x-mexal-tipo: Alfanumerico
        paese_iso:
          type: string
          description: Codice ISO paese.
          x-mexal-tipo: Alfanumerico
        gest_per_fisica:
          type: string
          description: Persona fisica.
          x-mexal-tipo: Alfanumerico
        telefono:
          type: string
          description: "Numero telefono — Numero di telefono."
          x-mexal-tipo: Alfanumerico
        nome_ricerca:
