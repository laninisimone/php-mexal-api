        - asp_est_beni
        - fino_val_spese_sped
        - utente_ult_mod
        - data_ult_mod
      description: Campi di anagrafica-contatti.
    AnagraficaContattiLista:
      type: object
      required:
        - dati
      properties:
        dati:
          type: array
          items:
            $ref: "#/components/schemas/AnagraficaContatti"
        data_ric_elab:
          type: string
          description: Timestamp di elaborazione, AAAAMMGG HHMMSS.
        next:
          type: string
          description: "Presente solo se ci sono altre pagine: da passare così com'è nel parametro next."
    AnagraficaContattiRicerca:
      type: object
      required:
        - filtri
      properties:
        filtri:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/Filtro"
              - properties:
                  campo:
                    $ref: "#/components/schemas/AnagraficaContattiCampo"
    AnagraficaContattiInserimento:
      allOf:
        - $ref: "#/components/schemas/AnagraficaContatti"
      required:
        - codice
        - descrizione
      description: "Body di inserimento. Obbligatori secondo il manuale: codice, descrizione."
    AnagraficaContattiModifica:
      allOf:
        - $ref: "#/components/schemas/AnagraficaContatti"
      description: "Body di revisione: solo i campi da modificare. Campi da indicare sempre secondo ?info=true: codice."
      x-mexal-obbligatori-put:
        - codice
    Filtro:
      type: object
      required:
        - campo
        - condizione
        - valore
      properties:
        campo:
          type: string
          description: Nome del campo su cui filtrare.
        indice1:
          type: integer
          minimum: 1
          description: Indice del primo livello, per i campi array.
        indice2:
          type: integer
          minimum: 1
          description: Indice del secondo livello, per gli array a due livelli.
        condizione:
          type: string
          enum:
            - "="
            - "<>"
            - ">"
            - "<"
            - ">="
            - "<="
            - contiene
            - inizia_per
        case_insensitive:
          type: boolean
          default: false
          description: Solo per i confronti fra stringhe.
        valore:
          description: "Valore da confrontare; un array mette i valori in OR. Date come AAAAMMGG."
          anyOf:
            - type: string
            - type: number
            - type: array
              minItems: 1
              items:
                type:
                  - string
                  - number
    Errore:
      type: object
      properties:
        error:
          type: object
          properties:
            response-code:
